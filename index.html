      return `<tr class="grp"><td colspan="4">${g}</td></tr>` + cls.map(c => {
        const v = p.alloc[c.id], r = REF.alloc[c.id], d = v - r;
        return `<tr><td><span class="sw" style="background:${c.couleur}"></span>${c.nom}</td><td class="n">${v} %</td>
          <td class="bars"><div class="pair"><i style="width:${Math.min(v * 1.5, 100)}%;background:${c.couleur}"></i><i class="ref" style="width:${Math.min(r * 1.5, 100)}%"></i></div></td>
          <td class="n"><span class="delta ${d > 0 ? "up" : d < 0 ? "down" : ""}">${d === 0 ? "=" : fmt(d)}</span></td></tr>`;
      }).join("");
    }).join("");
    const crisisRows = CR.map((c, i) => {
      const a = st.crises[i], b = rs.crises[i], maxv = 45;
      return `<div class="crisis"><div class="crisis-head"><span><strong>${c.nom}</strong> <span class="muted">${c.periode}</span></span></div>
        <div class="crisis-bars">
          <div class="cb"><span class="cb-l">Vous</span><span class="cb-track"><i style="width:${Math.min(Math.abs(a) / maxv * 100, 100)}%;background:${a < 0 ? "var(--warn)" : "var(--good)"}"></i></span><span class="mono">${fmt(a)} %</span></div>
          <div class="cb"><span class="cb-l muted">60/40</span><span class="cb-track"><i style="width:${Math.min(Math.abs(b) / maxv * 100, 100)}%;background:var(--ref)"></i></span><span class="mono muted">${fmt(b)} %</span></div>
        </div></div>`;
    }).join("");
    const WORD = { "-2": "fortement sous-pondéré", "-1": "sous-pondéré", "0": "neutre", "1": "surpondéré", "2": "fortement surpondéré" };
    const vcWord = v => v === 0 ? "équilibré" : (Math.abs(v) === 2 ? "fortement " : "") + (v > 0 ? "value" : "croissance");
    const neutral = FA.every(f => p.facteurs[f.id] === 0);
    const factors = neutral
      ? `<p class="fneutral">Aucune inclinaison de style : la poche actions suit la pondération de marché d'un indice mondial.</p>`
      : FA.map(f => { const v = p.facteurs[f.id], w = f.id === "vc" ? vcWord(v) : WORD[String(v)];
          const fill = v === 0 ? "" : `<i class="ffill" style="${v > 0 ? "left:50%" : `left:${50 - Math.abs(v) * 25}%`};width:${Math.abs(v) * 25}%"></i>`;
          return `<div class="frow" title="${f.def}"><div class="fhead"><span>${f.nom}</span><span class="fword ${v === 0 ? "muted" : ""}">${w}</span></div>
            <div class="ftrack" role="img" aria-label="${f.nom} : ${w}"><span class="fmid"></span>${fill}</div>
            <div class="fends"><span>${f.gauche}</span><span>${f.droite}</span></div></div>`; }).join("");
    const fdefs = FA.filter(f => neutral || p.facteurs[f.id] !== 0).map(f => `<li><strong>${f.nom}.</strong> ${f.def} <span class="muted">${f.recherche}.</span></li>`).join("");
    return `<section class="chapter" style="--fam:${famColor(code)}">
      <span class="eyebrow">Chapitre 4</span><h2>L'allocation type de votre profil</h2>
      <div class="reg" role="note"><strong>Illustration pédagogique, pas un conseil en investissement.</strong> Cette allocation décrit l'archétype « ${p.nom} ». Elle ne tient compte ni de votre patrimoine, ni de vos revenus, ni de vos objectifs, ni de votre horizon, et ne vise aucun produit financier. ${resultat ? (riskToken() ? "Votre allocation ajustée à votre situation figure plus haut, dans la partie Étape 2. " : "L'étape 2 facultative, plus haut, l'ajuste à votre situation. ") : ""}<a href="#avertissement">Lire l'avertissement</a></div>
      <p class="prose">${t.actifsPourquoi}</p>

      <div class="model"><span class="eyebrow">Portefeuille de référence</span><strong>${p.modele.nom}</strong><span class="muted">${p.modele.desc}</span></div>

      <div class="kpis">
        <div><span class="eyebrow">Niveau de risque</span><span class="kpi kpi-word">${niveau(Math.min(...st.crises)).mot}</span><span class="pscale" aria-hidden="true">${[1, 2, 3, 4, 5].map(k => `<i class="${k <= niveau(Math.min(...st.crises)).n ? "on" : ""}"></i>`).join("")}</span><span class="muted">selon la pire perte estimée en crise<br>60/40 : ${niveau(Math.min(...rs.crises)).mot.toLowerCase()}</span></div>
        <div><span class="eyebrow">Actions</span><span class="kpi">${st.actions} %</span><span class="muted">du portefeuille<br>60/40 : ${rs.actions} %</span></div>
        <div><span class="eyebrow">Pire crise estimée</span><span class="kpi">${fmt(Math.min(...st.crises))} %</span><span class="muted">sur les trois épisodes<br>60/40 : ${fmt(Math.min(...rs.crises))} %</span></div>
        <div><span class="eyebrow">Liquidité</span><span class="kpi">${st.liq} %</span><span class="muted">mobilisable en moins d'un mois · <span class="liq ${st.liq >= 90 ? "good" : st.liq >= 70 ? "info" : "warn"}">${st.liq >= 90 ? "élevée" : st.liq >= 70 ? "moyenne" : "faible"}</span><br>60/40 : ${rs.liq} %</span></div>
      </div>

      <div class="grid2" style="margin-top:20px">
        <div class="panel">
          <h3>Allocation naturelle <span class="eyebrow">${code}</span></h3>
          <div class="alloc-bar" role="img" aria-label="Allocation naturelle du profil ${code}">${bar}</div>
          <div class="table-wrap"><table class="alloc-table"><thead><tr><th>Classe d'actifs</th><th style="text-align:right">Poids</th><th style="padding-left:12px">Vous / 60/40</th><th style="text-align:right">Écart</th></tr></thead><tbody>${rows}</tbody></table></div>
          <p class="muted small">${p.note}</p>
        </div>
        <div class="stack">
          <div class="panel"><h3>À l'épreuve des crises</h3>${crisisRows}
            <p class="muted small">Performance estimée de l'allocation sur chaque épisode, en euros, comparée à un portefeuille 60/40. Ordres de grandeur.</p></div>
          <div class="panel" style="--fam:${famColor(code)}"><h3>Inclinaisons de la poche actions</h3>${factors}
            <p class="small">${p.facteursPourquoi}</p>
            <details class="fdetails"><summary>Ce que mesurent ces facteurs</summary><ul class="list">${fdefs}</ul><p class="muted small">Détail des études et du comportement en crise : <a href="#methode">page Méthode</a>.</p></details></div>
        </div>
      </div>

      <div class="grid2" style="margin-top:20px">
        <div class="panel"><h3>Les actifs préférés de ce profil</h3><div class="chips">${p.actifs.map(a => `<span>${a}</span>`).join("")}</div></div>
        <div class="panel"><div class="callout"><span class="eyebrow">Garde-fou en une ligne</span><p>${p.gardeFou}</p></div>
          <p class="muted small">Le niveau de risque est déduit de la pire perte estimée en crise, sans prévision de rendement ; les pertes en crise sont des estimations historiques arrondies. Les performances passées ne préjugent pas des performances futures. Tout investissement comporte un risque de perte en capital.</p></div>
      </div>
    </section>`;
  }

  /* ---------- Étape 2 : section du résultat ---------- */
  const LIBS = { S1: "épargne de précaution", S2: "part de votre patrimoine investie", S3: "stabilité de vos revenus", S4: "endettement", S5: "conséquences d'une perte de 30 %", S6: "besoin probable de liquidités", S7: "concentration de votre patrimoine", S8: "perte supportable en euros",
    O1: "horizon de placement", O2: "objectif du placement", O3: "retraits réguliers" };
  const nomCl = id => (CL.find(c => c.id === id) || { nom: id }).nom;
  const SUBNOM = { MON: "monétaire", GOVC: "obligations d'État courtes", INFL: "obligations indexées sur l'inflation", IG: "crédit de qualité (investment grade)", ACTD: "actions des pays développés", SMALL: "petites capitalisations", OR: "or" };
  const courtCl = id => SUBNOM[id] || nomCl(id).toLowerCase();
  const scale5 = n => `<span class="pscale" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
  function riskToken() { return MR.decoder(decodeURIComponent(location.hash || "")); }
  function localRisk(k) {
    const loc = store.get("pi-risque");
    if (!loc || !loc.answers || !k) return null;
    try { return MR.encoder(MR.evaluer(loc.answers)) === k.token ? loc.answers : null; } catch (e) { return null; }
  }
  /* Encadré compact à droite des jauges : invitation à l'étape 2, ou résumé du profil de risque */
  function riskMini(r, code) {
    const k = riskToken();
    if (!k) return `<div class="panel e2-mini">
        <span class="eyebrow">Étape 2 · facultative · 6 min</span>
        <h3>Votre profil de risque</h3>
        <p class="muted small">Votre tempérament dit ce que vous êtes prêt à supporter ; votre situation, votre horizon et vos connaissances, ce que vous pouvez supporter. L'étape 2 croise les deux et ajuste l'allocation de votre profil.</p>
        <div class="actions"><a class="btn" href="#etape2/${r.token}">Commencer l'étape 2</a></div></div>`;
    const pr = MR.profil(r.axes.R.score, k), N = RQ.NIVEAUX[pr.final - 1];
    const lv = (lab, n, key) => `<span class="${pr.limitants.includes(key) ? "lim" : ""}">${lab} <strong>${n}/5</strong></span>`;
    return `<div class="panel e2-mini" style="--fam:${famColor(code)}">
        <span class="eyebrow">Étape 2 · profil de risque indicatif</span>
        <h3>${N.nom} <span class="mono muted">${pr.final}/5</span></h3>
        ${scale5(pr.final)}
        <div class="mini-lv">${lv("Tolérance", pr.T, "T")}${lv("Capacité de perte", pr.C, "C")}${lv("Horizon", pr.H, "H")}</div>
        <p class="muted small">Pire perte de crise tolérée : ${N.court}. Le plafond le plus bas fixe le niveau.</p>
        <button class="linkbtn" id="to-e2" style="justify-self:start">Voir l'allocation ajustée</button></div>`;
  }
  function ctaE2(r) {
    return `<section class="panel e2-cta" style="margin-top:32px">
      <div><span class="eyebrow">Étape 2 · facultative · environ 6 minutes</span>
        <h2>Passez de votre tempérament à votre profil de risque</h2>
        <p class="muted">Votre tempérament dit ce que vous êtes prêt à supporter. Votre situation, votre horizon et vos connaissances disent ce que vous pouvez supporter. L'étape 2 croise les deux, selon la structure des orientations européennes sur l'adéquation, et ajuste l'allocation de votre profil à votre niveau de risque.</p></div>
      <div class="actions"><a class="btn" href="#etape2/${r.token}">Commencer l'étape 2</a></div>
    </section>`;
  }
  function risqueSignals(r, k, pr) {
    const out = [], sig = (cls, label, txt) => out.push(`<div class="signal"><span class="pill ${cls}">${label}</span><span>${txt}</span></div>`);
    const d = pr.T - pr.C;
    if (d >= 2) sig("warn", "Tempérament > situation", "Votre tempérament est nettement plus offensif que votre situation ne le permet. C'est votre capacité de perte qui fixe le niveau : une perte que votre situation ne peut pas absorber vous obligerait à vendre au pire moment, quel que soit votre tempérament.");
    else if (d === 1) sig("info", "Tempérament > situation", "Votre situation limite d'un cran le niveau de risque que votre tempérament accepterait.");
    else if (d <= -2) sig("good", "Situation > tempérament", "Votre situation permettrait davantage de risque que votre tempérament n'en accepte. C'est votre tempérament qui fixe le niveau, et c'est légitime : un placement que l'on ne supporte pas finit souvent vendu au mauvais moment.");
    if (pr.H < Math.min(pr.T, pr.C)) sig("warn", "Horizon", `Votre horizon ou votre objectif est la contrainte la plus forte (${k.bindO.map(x => LIBS[x]).join(", ")}). Une somme dont on a besoin bientôt ne peut pas attendre la fin d'une crise.`);
    if (k.W) sig("warn", "Contradiction", "Deux de vos réponses sur votre capacité de perte se contredisent : les conséquences d'une perte de 30 % et la perte que vous pourriez supporter en euros. Le niveau le plus prudent est retenu ; un conseiller devrait lever cette contradiction avec vous.");
    if (k.X === 2) sig("warn", "Concentration", "Plus de la moitié de votre patrimoine est déjà exposée à un même risque. Votre capacité de perte est plafonnée, et la diversification de cette somme compte davantage que son rendement.");
    else if (k.X === 1) sig("info", "Concentration", "Une partie de votre patrimoine est déjà exposée à un même risque : évitez d'y ajouter des placements qui en dépendent.");
    if (k.L === 2) sig("info", "Liquidité", "Vous aurez probablement besoin d'une partie de cette somme avant l'échéance : l'immobilier non coté et le non coté sont exclus de l'allocation.");
    else if (k.L === 1) sig("info", "Liquidité", "Un retrait anticipé est possible : la part d'immobilier non coté et de non coté est réduite de moitié.");
    const DL = ["débutant", "intermédiaire", "confirmé", "expert"][k.D - 1];
    if (k.D >= 3 && k.K <= 3) sig("warn", "Connaissances", `Vous vous estimez ${DL}, mais le quiz donne ${k.K} bonne${k.K > 1 ? "s" : ""} réponse${k.K > 1 ? "s" : ""} sur 6. Surestimer ses connaissances est un risque que les orientations européennes demandent explicitement de détecter.`);
    else if (k.D === 1 && k.K >= 5) sig("good", "Connaissances", `Vous vous estimez débutant, mais le quiz donne ${k.K} bonnes réponses sur 6 : vous en savez plus que vous ne le pensez.`);
    else sig("good", "Connaissances", `Vos connaissances déclarées (${DL}) et mesurées (${k.K} sur 6) concordent.`);
    if (r.mode === "c") sig("info", "Version courte", "Votre tolérance a été mesurée par la version courte, avec quatre questions sur l'axe Risque contre douze dans le test complet.");
    if (r.coherence !== null && r.coherence < 60) sig("warn", "Cohérence", "Vos réponses au test de tempérament se contredisent souvent : la tolérance retenue est fragile.");
    return out.join("");
  }
  function riskSection(r, code) {
    const k = riskToken();
    if (!k) return "";
    const sR = r.axes.R.score, pr = MR.profil(sR, k), N = RQ.NIVEAUX[pr.final - 1];
    const p = P[code], nat = stats(p.alloc), natPire = Math.min(...nat.crises), natN = niveau(natPire).n;
    const adj = MR.ajuster(p.alloc, pr.final, k.masque, k.L, CL), st = stats(adj.alloc), adjPire = Math.min(...st.crises);
    const lim = key => pr.limitants.includes(key);
    const card = (key, titre, n, detail) => `<div class="lvl${lim(key) ? " bind" : ""}">
        <span class="eyebrow">${titre}</span><span class="kpi kpi-word">${RQ.NIVEAUX[n - 1].nom}</span>${scale5(n)}
        <span class="muted small">${detail}</span>${lim(key) ? `<span class="pill warn">Plafond retenu</span>` : ""}</div>`;
    const tolTxt = `Axe Risque : ${sR > 50 ? sR + " % Offensive" : (100 - sR) + " % Sécurité"}, mesuré par vos réponses au test`;
    const capTxt = k.bindS.length ? "Limitée par : " + k.bindS.map(x => LIBS[x]).join(", ") : "Aucune contrainte particulière";
    const horTxt = k.bindO.length ? "Limités par : " + k.bindO.map(x => LIBS[x]).join(", ") : "Aucune contrainte particulière";

    /* Classes retirées, regroupées */
    const ret = {};
    adj.retirees.forEach(x => { const o = ret[x.id] || (ret[x.id] = { id: x.id, w: 0, causes: new Set(), vers: x.vers }); o.w += x.w; o.causes.add(x.cause); });
    const retList = Object.values(ret).map(x => `<li><span><strong>${nomCl(x.id)}</strong> (${Math.round(x.w)} % de l'allocation naturelle) → ${Object.keys(x.vers).map(courtCl).join(" et ")}. <span class="muted">${[...x.causes].map(c => c === "liquidite" ? "Besoin de liquidités." : "Connaissances ou expérience insuffisantes pour ce type de placement.").join(" ")}</span></span></li>`).join("");
    const lam = Math.round(adj.lambda * 100);
    const phrase = adj.lambda >= 0.995
      ? (adj.retirees.length ? `L'allocation naturelle de votre profil respecte déjà le niveau ${N.nom.toLowerCase()} ; seules les classes indiquées plus bas sont remplacées.` : `L'allocation naturelle de votre profil respecte déjà le niveau ${N.nom.toLowerCase()} : elle est conservée telle quelle.`)
      : `Pour respecter le niveau ${N.nom.toLowerCase()}, votre allocation conserve <strong>${lam} %</strong> de l'allocation de votre profil ; les ${100 - lam} % restants vont dans une poche de sécurité (40 % monétaire, 30 % obligations d'État courtes, 30 % crédit de qualité).`;

    const bar = CL.filter(c => adj.alloc[c.id] > 0).map(c => `<span style="width:${adj.alloc[c.id]}%;background:${c.couleur};color:${darkText(c.couleur) ? "#132029" : "#fff"}" title="${c.nom} : ${adj.alloc[c.id]} %">${adj.alloc[c.id] >= 7 ? adj.alloc[c.id] + "%" : ""}</span>`).join("");
    const rows = CL.filter(c => p.alloc[c.id] > 0 || adj.alloc[c.id] > 0).map(c => {
      const a = p.alloc[c.id], b = adj.alloc[c.id], dd = b - a;
      return `<tr><td><span class="sw" style="background:${c.couleur}"></span>${c.nom}</td><td class="n muted">${a} %</td><td class="n"><strong>${b} %</strong></td><td class="n"><span class="delta ${dd > 0 ? "up" : dd < 0 ? "down" : ""}">${dd === 0 ? "=" : fmt(dd)}</span></td></tr>`;
    }).join("");

    /* Connaissances et durabilité */
    const loc = localRisk(k);
    const quiz = loc ? `<details class="fdetails"><summary>Revoir le quiz</summary><ul class="list quiz">${["K1", "K2", "K3", "K4", "K5", "K6"].map(id => {
        const q = qR(id), a = loc[id], good = typeof a === "number" && q.options[a].ok, rep = q.options.find(o => o.ok).t;
        return `<li class="${good ? "ok" : "ko"}"><span><strong>${q.theme} ${good ? "✓" : "✗"}</strong> ${good ? "" : `Bonne réponse : ${rep}. `}<span class="muted">${q.explication}</span></span></li>`; }).join("")}</ul></details>` : "";
    const complexes = RQ.COMPLEXES.map((c, i) => `<li class="${k.masque[i] === "1" ? "ok" : "ko"}"><span><strong>${nomCl(c.id)}</strong> : ${k.masque[i] === "1" ? "accessible" : "non accessible"}<br><span class="muted small">Condition : ${c.regle.charAt(0).toLowerCase() + c.regle.slice(1)}.</span></span></li>`).join("");
    let dur;
    if (!k.S) dur = `<p class="muted">Pas de préférence de durabilité exprimée.</p>`;
    else if (loc) {
      const ev = MR.evaluer(loc);
      dur = `<ul class="list"><li><span>Part minimale alignée sur la taxonomie européenne : <strong>${ev.dur.taxo ? ev.dur.taxo + " %" : "pas de minimum"}</strong></span></li><li><span>Part minimale d'investissements durables (SFDR) : <strong>${ev.dur.sfdr ? ev.dur.sfdr + " %" : "pas de minimum"}</strong></span></li><li><span>Principales incidences négatives : <strong>${ev.dur.pai.length ? ev.dur.pai.join(", ").toLowerCase() : "pas de préférence"}</strong></span></li></ul>`;
    } else dur = `<p>Vous avez exprimé des préférences de durabilité. Leur détail reste sur l'appareil où vous avez répondu.</p>`;

    return `<section class="e2-res" style="margin-top:40px;--fam:${famColor(code)}">
      <div class="sec-head"><span class="eyebrow">Étape 2 · profil de risque indicatif</span>
        <h2>Votre profil de risque : ${N.nom} <span class="mono muted">${pr.final}/5</span></h2>
        <p class="muted">Le plus prudent de trois plafonds. Pire perte de crise tolérée : ${N.court}.</p></div>
      <div class="reg" role="note"><strong>Profil indicatif, pas une évaluation de l'adéquation.</strong> Sa structure suit les orientations de l'ESMA sur l'adéquation (MiFID II). Il ne remplace pas l'évaluation qu'un établissement agréé ou un conseiller en investissements financiers doit réaliser, et ne recommande aucun produit. <a href="#avertissement">Avertissement</a></div>
      <div class="ladder">
        ${card("T", "Tolérance · votre tempérament", pr.T, tolTxt)}
        ${card("C", "Capacité de perte · votre situation", pr.C, capTxt)}
        ${card("H", "Horizon et objectifs", pr.H, horTxt)}
        <div class="lvl final"><span class="eyebrow">Niveau retenu</span><span class="kpi kpi-word">${N.nom}</span>${scale5(pr.final)}<span class="muted small">Votre profil ${code} : allocation naturelle de niveau ${natN}/5 (pire crise ${fmt(natPire)} %)</span></div>
      </div>
      <div class="grid2" style="margin-top:20px">
        <div class="panel"><h3>Ce que révèle l'étape 2</h3><div class="signals">${risqueSignals(r, k, pr)}</div></div>
        <div class="panel"><h3>Connaissances et durabilité</h3>
          <p>Quiz : <strong>${k.K} bonne${k.K > 1 ? "s" : ""} réponse${k.K > 1 ? "s" : ""} sur 6</strong> · niveau déclaré : ${["débutant", "intermédiaire", "confirmé", "expert"][k.D - 1]}</p>
          <ul class="list cplx">${complexes}</ul>${quiz}
          <span class="eyebrow">Préférences de durabilité</span>${dur}
          <p class="muted small">Investype raisonne par classes d'actifs et ne sélectionne aucun fonds : vos préférences de durabilité ne modifient pas l'allocation. Elles s'appliqueraient au choix des produits.</p></div>
      </div>
      <div class="panel" style="margin-top:20px">
        <h3>Votre allocation ajustée <span class="eyebrow">${code} · niveau ${N.nom.toLowerCase()}</span></h3>
        <p>${phrase}</p>
        <div class="kpis">
          <div><span class="eyebrow">Niveau de risque</span><span class="kpi">${niveau(adjPire).n}/5</span><span class="muted">${niveau(adjPire).mot.toLowerCase()} · allocation naturelle : ${natN}/5</span></div>
          <div><span class="eyebrow">Actions</span><span class="kpi">${st.actions} %</span><span class="muted">allocation naturelle : ${nat.actions} %</span></div>
          <div><span class="eyebrow">Pire crise estimée</span><span class="kpi">${fmt(adjPire)} %</span><span class="muted">allocation naturelle : ${fmt(natPire)} %</span></div>
          <div><span class="eyebrow">Liquidité</span><span class="kpi">${st.liq} %</span><span class="muted">allocation naturelle : ${nat.liq} %</span></div>
        </div>
        <div class="alloc-bar" role="img" aria-label="Allocation ajustée">${bar}</div>
        <div class="table-wrap"><table class="alloc-table"><thead><tr><th>Classe d'actifs</th><th style="text-align:right">Naturelle</th><th style="text-align:right">Ajustée</th><th style="text-align:right">Écart</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${retList ? `<div><span class="eyebrow">Classes remplacées</span><ul class="list">${retList}</ul></div>` : ""}
        <p class="muted small">Le niveau retenu est un plafond, pas un objectif : l'étape 2 n'ajoute jamais de risque à l'allocation de votre profil. Pertes de crise estimées sur 2008, le krach de 2020 et 2022 ; ordres de grandeur, sans prévision de rendement. Tout investissement comporte un risque de perte en capital.</p>
      </div>
      <div class="actions" style="margin-top:20px"><a class="btn ghost" href="#etape2/${r.token}">Modifier mes réponses</a><button class="btn ghost" id="e2-del">Effacer mes réponses de cet appareil</button></div>
    </section>`;
  }

  /* ---------- Résultat ---------- */
  function gauge(axId, r, friend) {
    const a = AXES.find(x => x.id === axId), s = r.score;
    const win = s > 50 ? a.p2 : a.p1, pct = s > 50 ? s : 100 - s;
    const color = s > 50 ? "var(--opp)" : "var(--tac)";
    const fill = s > 50 ? `left:50%;width:${s - 50}%` : `left:${s}%;width:${50 - s}%`;
    const ticks = (r.rev !== null && r.decl !== null)
      ? `<span class="gauge-tick" style="left:calc(${r.rev}% - 1px)" title="Révélé : ${r.rev}"></span><span class="gauge-tick decl" style="left:calc(${r.decl}% - 1px)" title="Déclaré : ${r.decl}"></span>` : "";
    const ft = friend ? `<span class="gauge-tick" style="left:calc(${friend.score}% - 1px);background:var(--con);height:28px;top:-8px" title="Comparaison : ${friend.score}"></span>` : "";
    return `<div class="gauge">
      <div class="gauge-head"><span>${a.nom}</span><span><span class="win">${pct} % ${win.n}</span> <span class="mono muted">(${win.l})</span></span></div>
      <div class="gauge-track"><span class="gauge-fill" style="${fill};background:${color}"></span><span class="gauge-mid"></span>${ticks}${ft}</div>
      <div class="gauge-foot"><span>${a.p1.l} · ${a.p1.n}</span><span>${a.p2.n} · ${a.p2.l}</span></div></div>`;
  }
  function signals(r) {
    const out = [];
    if (r.coherence !== null) {
      const c = r.coherence;
      out.push(c >= 75 ? `<div class="signal"><span class="pill good">Cohérence ${c}</span><span>Vos réponses aux questions miroirs se recoupent bien. Le profil est fiable.</span></div>`
        : c >= 60 ? `<div class="signal"><span class="pill info">Cohérence ${c}</span><span>Quelques réponses se contredisent légèrement. Le profil reste exploitable.</span></div>`
        : `<div class="signal"><span class="pill warn">Cohérence ${c}</span><span>Plusieurs réponses se contredisent. Repassez le test au calme avant d'en tirer des conclusions.</span></div>`);
    }
    for (const a of AXES) {
      const x = r.axes[a.id];
      if (!x || x.decl === null || x.rev === null) continue;
      const g = x.rev - x.decl;
      if (Math.abs(g) > 20) {
        const vers = g > 0 ? a.p2.n : a.p1.n;
        out.push(`<div class="signal"><span class="pill warn">Écart ${g > 0 ? "+" : ""}${g}</span><span>Axe ${a.nom.toLowerCase()} : en situation, vous agissez plus « ${vers.toLowerCase()} » que vous ne le déclarez (déclaré ${x.decl}, révélé ${x.rev}).</span></div>`);
      }
    }
    if (out.length < 2 && r.mode === "f") out.push(`<div class="signal"><span class="pill good">Aligné</span><span>Sur tous les axes, ce que vous déclarez et ce que vous feriez concordent à moins de 20 points près.</span></div>`);
    return out.join("");
  }
  /* Résumé de fiabilité en une ligne ; le détail est en fin de page */
  function fiabBref(r) {
    const pills = [];
    if (r.coherence !== null) pills.push(`<span class="pill ${r.coherence >= 75 ? "good" : r.coherence >= 60 ? "info" : "warn"}">Cohérence ${r.coherence}</span>`);
    const ecarts = AXES.filter(a => { const x = r.axes[a.id]; return x && x.decl !== null && x.rev !== null && Math.abs(x.rev - x.decl) > 20; }).length;
    if (r.mode === "f") pills.push(ecarts ? `<span class="pill warn">${ecarts} écart${ecarts > 1 ? "s" : ""} déclaré / révélé</span>` : `<span class="pill good">Déclaré et révélé alignés</span>`);
    if (!pills.length) return "";
    return `<div class="fiab-line"><span class="eyebrow">Fiabilité</span>${pills.join("")}<button class="linkbtn" id="to-fiab">Détail</button></div>`;
  }
  function renderResult(r, friendToken) {
    const code = S.code(r.axes), suf = S.suffixe(r.axes), p = P[code];
    const friend = friendToken ? S.decode(friendToken) : null;
    const vois = S.voisins(r.axes);
    const fcode = friend ? S.code(friend.axes) : null;
    const common = friend ? [...code].filter((ch, i) => ch === fcode[i]).length : 0;
    show(`
      <div class="pcard" style="--fam:${famColor(code)}">
        ${emblem(code)}
        <div class="pcard-text">
          <span class="eyebrow">Votre profil d'investisseur</span>
          <div class="code-big">${code}${suf ? "-" + suf : ""}</div>
          <h1>${p.nom}</h1>
          <p class="devise">« ${p.devise} »</p>
          <p class="fam-label">Famille <strong>${F[famOf(code)].nom.replace("Les ", "des ")}</strong> · ${suf === "R" ? "tempérament réactif" : suf === "D" ? "tempérament discipliné" : "suffixe non mesuré (version courte)"}</p>
        </div>
      </div>

      <section style="margin-top:32px">
        <div class="grid2">
          <div class="panel">
            <h3>Vos axes ${friend ? `<span class="eyebrow" style="color:var(--con)">comparé à ${fcode}</span>` : ""}</h3>
            ${AX4.map(a => gauge(a.id, r.axes[a.id], friend && friend.axes[a.id])).join("")}
            ${r.axes.X ? gauge("X", r.axes.X, friend && friend.axes.X) : ""}
            <div class="legend"><span><i></i>Score révélé</span><span><i class="d"></i>Score déclaré</span>${friend ? `<span><i style="border-color:var(--con)"></i>Comparaison</span>` : ""}</div>
          </div>
          <div class="stack fill">
          <div class="panel">
            <h3>En bref</h3>
            ${fiabBref(r)}
            ${vois.length ? `<p class="muted" style="font-size:.92rem">Profil${vois.length > 1 ? "s" : ""} voisin${vois.length > 1 ? "s" : ""}, car un axe est proche de l'équilibre : ${vois.map(v => `<a href="#profil-${v.code}"><strong class="mono">${v.code}</strong> ${P[v.code].nom}</a>`).join(", ")}.</p>` : ""}
            ${suf ? `<div class="callout" style="--fam:${suf === "R" ? "var(--warn)" : "var(--good)"}"><span class="eyebrow">${suf === "R" ? "Suffixe -R · Réactif" : "Suffixe -D · Discipliné"}</span><p>${suf === "R" ? "Vos émotions pèsent sur vos décisions quand le marché bouge vite. Vos règles de discipline et votre garde-fou sont à appliquer en priorité." : "Vous tenez vos règles quand le marché s'agite. C'est un avantage décisif : la plupart des pertes évitables viennent de décisions prises sous le stress."}</p></div>` : `<p class="muted" style="font-size:.92rem">La version courte ne mesure ni la discipline sous stress ni la cohérence. <a href="#test-complet">Passer le test complet</a>.</p>`}
            ${friend ? `<p style="font-size:.92rem"><strong>${common} lettre${common > 1 ? "s" : ""} sur 4 en commun</strong> avec ${fcode} (${P[fcode].nom}).</p>` : ""}
          </div>
          ${riskMini(r, code)}
          </div>
        </div>
      </section>

      ${riskSection(r, code)}

      <div style="margin-top:40px">${profileBlocks(code, true)}</div>

      <section class="fiab" id="fiabilite" style="margin-top:56px">
        <h2>La fiabilité de votre résultat</h2>
        <p class="muted small">Cohérence entre vos réponses aux questions miroirs, et écarts entre ce que vous déclarez et ce que vous feriez en situation.</p>
        <div class="signals compact">${signals(r)}</div>
      </section>

      <section style="margin-top:56px">
        <div class="grid2">
          <div class="panel"><h3>Partager votre résultat</h3>
            <p class="muted" style="font-size:.92rem">Votre code de résultat contient vos scores. Envoyez-le à vos amis pour comparer vos profils.</p>
            <div class="share"><input id="share-code" readonly value="${r.token}" aria-label="Code de résultat"><button class="btn ghost" id="copy">Copier</button></div>
            ${riskToken() ? `<label class="check"><input type="checkbox" id="share-k"> Inclure mon profil de risque (niveaux seulement, aucun montant ni réponse détaillée)</label>` : ""}
            <span class="toast" id="toast" aria-live="polite"></span>
          </div>
          <div class="panel"><h3>Comparer avec un ami</h3>
            <p class="muted" style="font-size:.92rem">Collez le code de résultat ou le lien d'un ami : ses scores s'affichent sur vos jauges.</p>
            <form class="share" id="cmp"><input id="cmp-code" placeholder="r-f-…" aria-label="Code de résultat d'un ami"><button class="btn ghost" type="submit">Comparer</button></form>
            <span class="toast" id="cmp-msg" aria-live="polite"></span>
          </div>
        </div>
        <div class="actions" style="margin-top:24px"><a class="btn" href="#test-complet">Refaire le test</a><a class="btn ghost" href="#profils">Voir les 16 profils</a></div>
      </section>
      <p class="disclaimer" style="margin-top:40px">Ce test est un outil pédagogique de connaissance de soi et de sensibilisation aux biais comportementaux. Il ne constitue ni un conseil en investissement, ni une recommandation personnalisée, ni une évaluation de l'adéquation au sens de la réglementation (MIF 2). Le test mesure votre tempérament face au risque ; l'étape 2 facultative en donne une lecture indicative croisée avec votre situation, votre horizon et vos connaissances, sans remplacer l'évaluation d'un professionnel. Avant toute décision, consultez un professionnel habilité. Aucune donnée n'est envoyée : vos réponses restent dans votre navigateur. <a href="#avertissement">Avertissement complet</a></p>
    `);
    const te = document.getElementById("to-e2");
    if (te) te.addEventListener("click", () => document.querySelector(".e2-res").scrollIntoView({ behavior: "smooth", block: "start" }));
    const tf = document.getElementById("to-fiab");
    if (tf) tf.addEventListener("click", () => document.getElementById("fiabilite").scrollIntoView({ behavior: "smooth", block: "start" }));
    const shk = document.getElementById("share-k"), k0 = riskToken();
    if (shk) shk.addEventListener("change", () => { document.getElementById("share-code").value = r.token + (shk.checked ? k0.token : ""); });
    const del = document.getElementById("e2-del");
    if (del) del.addEventListener("click", () => { store.del("pi-risque"); store.del("pi-risque-progress"); const l = store.get("pi-dernier"); if (l && l.token) store.set("pi-dernier", { token: l.token.split("~")[0], code: l.code }); location.hash = r.token; });
    document.getElementById("copy").addEventListener("click", () => {
      const inp = document.getElementById("share-code"), t = document.getElementById("toast");
      const val = inp.value;
      const ok = () => { t.textContent = "Code copié."; };
      const fail = () => { inp.select(); t.textContent = "Code sélectionné : copiez-le avec Ctrl+C ou ⌘C."; };
      try { navigator.clipboard.writeText(val).then(ok, fail); } catch (e) { fail(); }
    });
    document.getElementById("cmp").addEventListener("submit", e => {
      e.preventDefault();
      const v = document.getElementById("cmp-code").value, m = document.getElementById("cmp-msg");
      if (!S.decode(v)) { m.style.color = "var(--warn)"; m.textContent = "Ce code n'est pas reconnu. Il commence par r-f- ou r-c-, suivi de 16 nombres."; return; }
      renderResult(r, v);
    });
  }

  /* ---------- Galerie et fiche ---------- */
  function renderGallery() {
    show(`<div class="sec-head"><span class="eyebrow">Galerie</span><h1>Les 16 profils</h1>
      <p class="muted">Quatre familles, définies par le rapport au risque et l'horizon. Dans chaque famille, la méthode de décision et le rapport au consensus dessinent quatre tempéraments.</p></div>
      <div style="margin-top:40px">${["SL", "SC", "OL", "OC"].map(f => `
        <div class="gallery-fam" style="--fam:var(${FAM_VAR[f]})">

    show(`<div class="pcard" style="--fam:${famColor(code)}">${emblem(code)}

  /* ---------- Méthode ---------- */
  function renderMethod() {
    show(`<div class="sec-head"><span class="eyebrow">Méthode</span><h1>Comment le test fonctionne</h1>
      <p class="muted">Le test s'appuie sur la finance comportementale. Il mesure quatre dimensions du tempérament d'investisseur et une cinquième, la discipline sous stress, qui détermine souvent la performance réelle.</p></div>
      <section style="margin-top:40px"><h2>Les axes</h2>
        <div class="table-wrap" style="margin-top:16px"><table class="mtable"><thead><tr><th>Axe</th><th>Pôle 1</th><th>Pôle 2</th><th>Ce qui est mesuré</th></tr></thead><tbody>
          <tr><td>Risque</td><td>S · Sécurité</td><td>O · Offensive</td><td>Tolérance psychologique à la perte, aversion aux pertes, rapport à la volatilité</td></tr>
          <tr><td>Horizon</td><td>L · Long terme</td><td>C · Court terme</td><td>Patience, préférence temporelle, fréquence de décision</td></tr>
          <tr><td>Méthode</td><td>A · Analyse</td><td>I · Intuition</td><td>Décision par les données et les modèles, ou par le flair et le récit</td></tr>
          <tr><td>Consensus</td><td>D · Divergent</td><td>T · Tendance</td><td>Contrarianisme, ou suivi du momentum et de la foule</td></tr>
          <tr><td>Suffixe</td><td>-D · Discipliné</td><td>-R · Réactif</td><td>Stabilité des décisions sous stress, respect de ses propres règles</td></tr>
        </tbody></table></div></section>
      <section style="margin-top:48px"><h2>Le calcul</h2>
        <ol class="steps prose" style="margin-top:16px">
          <li>Chaque réponse est ramenée entre 0 et 1 vers le second pôle de l'axe.</li>
          <li>Le score déclaré est la moyenne des questions déclaratives ; le score révélé, celle des mises en situation, arbitrages chiffrés et comportements passés.</li>
          <li>Le score de l'axe vaut 40 % du déclaré et 60 % du révélé, moins sensible à l'image de soi.</li>
          <li>Au-dessus de 50, la lettre retenue est celle du second pôle. Entre 45 et 55, l'axe est équilibré et un profil voisin est proposé. Un axe exactement à 50 est départagé par le score révélé, puis par les mises en situation, puis par le score déclaré.</li>
          <li>Les réponses « je ne sais pas » aux deux questions de calcul et les réponses « non concerné » sont exclues du calcul.</li>
          <li>Un écart de plus de 20 points entre déclaré et révélé est signalé.</li>
          <li>Cinq paires de questions miroirs donnent un indice de cohérence ; sous 60, le résultat est présenté comme fragile.</li>
        </ol></section>
      <section style="margin-top:48px"><h2>Les fondements</h2>
        <p class="prose muted" style="margin-top:12px">Théorie des perspectives et aversion aux pertes (Kahneman et Tversky, 1979) ; typologies d'investisseurs de Bailard, Biehl et Kaiser (1986) et de Pompian ; échelle de tolérance au risque de Grable et Lytton (1999) ; choix de loteries de Holt et Laury (2002) ; test de réflexion cognitive de Frederick (2005). Les liens entre biais et comportements s'appuient sur les travaux de Shefrin et Statman (1985), Barber et Odean (2000), Huberman (2001) et Kumar (2009).</p></section>
      <section style="margin-top:48px"><h2>Les allocations d'actifs</h2>
        <p class="prose muted" style="margin-top:12px">Chaque profil reçoit une allocation naturelle sur quinze classes d'actifs, construite par écart à un portefeuille de référence documenté (Graham, Bogle, Browne, Dalio, Swensen, Buffett, Faber, De Bondt et Thaler…), et une inclinaison factorielle de sa poche actions. Le niveau de risque, sur cinq niveaux, est déduit de la pire perte estimée de l'allocation sur les trois crises de référence : faible au-dessus de −11 %, modéré jusqu'à −18 %, intermédiaire jusqu'à −25 % (le 60/40 se situe à −23 %), élevé jusqu'à −32,5 %, très élevé au-delà. Aucun rendement chiffré n'est affiché ; les hypothèses de long terme d'Amundi (second semestre 2026) et de J.P. Morgan (2026) ont seulement servi à construire les allocations. Règle de cohérence : tout profil Offensive a un niveau de risque supérieur à celui du 60/40, et tout profil Sécurité un niveau inférieur ou égal. Les performances en crise sont des ordres de grandeur en euros, calculés classe par classe pour 2008, le krach de février-mars 2020 et 2022. Pour l'immobilier non coté et le non coté financier, ce sont des pertes « économiques » : les valeurs publiées (SCPI, fonds non cotés) baissent moins et plus tard, car elles reposent sur des expertises périodiques. L'immobilier coté (foncières) se comporte comme des actions ; il n'est presque pas utilisé dans les allocations. L'indicateur de liquidité mesure la part du portefeuille mobilisable en moins d'un mois : élevée au-delà de 90 %, moyenne entre 70 % et 90 %, faible en dessous.</p>
        <div class="table-wrap" style="margin-top:16px"><table class="mtable"><thead><tr><th>Classe d'actifs</th><th>2008</th><th>Krach 2020</th><th>2022</th><th>Liquidité</th></tr></thead><tbody>
          ${CL.map(c => `<tr><td>${c.nom}</td>${c.c.map(x => `<td class="mono">${fmt(x)} %</td>`).join("")}<td>${window.ILLIQUIDES.includes(c.id) ? "plus d'un mois" : "moins d'un mois"}</td></tr>`).join("")}
        </tbody></table></div></section>
      <section style="margin-top:48px"><h2>Les facteurs de style</h2>
        <p class="prose muted" style="margin-top:12px">La poche actions de chaque profil est inclinée vers des facteurs de style documentés par la recherche académique. Value et croissance forment un seul axe, puisqu'il s'agit des deux côtés d'une même mesure. Chaque inclinaison va de −2 à +2 par rapport à un indice mondial pondéré par les capitalisations.</p>
        <div class="table-wrap" style="margin-top:16px"><table class="mtable"><thead><tr><th>Facteur</th><th>Ce qu'il mesure</th><th>Fondement académique</th><th>Comportement en crise</th></tr></thead><tbody>
          ${FA.map(f => `<tr><td><strong>${f.nom}</strong></td><td>${f.def}</td><td>${f.recherche}</td><td>${f.crises}</td></tr>`).join("")}
        </tbody></table></div>
        <p class="muted small" style="margin-top:8px">${window.SOURCES_FACTEURS}</p></section>
      <section style="margin-top:48px"><h2>L'étape 2 : le profil de risque indicatif</h2>
        <p class="prose muted" style="margin-top:12px">L'étape 2 reprend la structure que les orientations de l'ESMA sur l'adéquation (MiFID II, 2022), appliquées en France par l'AMF (position DOC-2019-03), imposent aux établissements qui conseillent : connaissances et expérience, situation financière et capacité à subir des pertes, objectifs, tolérance au risque et préférences de durabilité. Elle n'en a pas la portée : elle ne remplace pas l'évaluation d'un professionnel et ne recommande aucun produit.</p>
        <ol class="steps prose" style="margin-top:16px">
          <li><strong>Tolérance.</strong> Elle vient de l'axe Risque du test, mesuré par des mises en situation et des arbitrages chiffrés plutôt que par l'auto-évaluation, comme le recommandent les orientations européennes. Score jusqu'à 20 : niveau 1 ; jusqu'à 35 : 2 ; jusqu'à 50 : 3 ; jusqu'à 70 : 4 ; au-delà : 5.</li>
          <li><strong>Capacité de perte.</strong> Huit questions factuelles sur la situation (épargne de précaution, part du patrimoine, revenus, endettement, besoin de liquidités, concentration, conséquences d'une perte, perte supportable en euros). Chaque réponse fixe un plafond ; la capacité est le plus bas d'entre eux. Elle est mesurée séparément de la tolérance : lors de ses contrôles, l'AMF a reproché à certains établissements de confondre les deux.</li>
          <li><strong>Horizon et objectifs.</strong> Échéance, but du placement et retraits prévus fixent un troisième plafond.</li>
          <li><strong>Niveau retenu.</strong> Le plus prudent des trois plafonds, sur la même échelle que le niveau de risque des allocations : pire perte de crise jusqu'à −11 %, −18 %, −25 %, −32,5 %, puis sans plafond.</li>
          <li><strong>Connaissances.</strong> Un quiz de six questions factuelles. Le haut rendement, la dette privée, le capital-investissement, les stratégies alternatives et les crypto-actifs ne restent dans l'allocation que si les questions correspondantes sont réussies ; pour le capital-investissement et les crypto-actifs, il faut aussi une expérience de ces placements, un métier de la finance ou au moins cinq bonnes réponses. Sinon, ils sont remplacés par un équivalent liquide et simple. Un besoin de liquidités exclut ou réduit de moitié les placements peu liquides.</li>
          <li><strong>Allocation ajustée.</strong> Allocation du profil × λ + poche de sécurité × (1 − λ), où λ est la plus grande part qui respecte le seuil dans chacune des trois crises de référence. La poche de sécurité comprend 40 % de monétaire, 30 % d'obligations d'État courtes et 30 % de crédit de qualité. Le niveau retenu est un plafond : on n'ajoute jamais de risque à l'allocation du profil.</li>
          <li><strong>Contrôles de cohérence.</strong> Écart entre tempérament et situation, contradiction entre deux mesures de la capacité de perte, écart entre connaissances déclarées et mesurées, concentration du patrimoine.</li>
          <li><strong>Durabilité.</strong> Questions en arbre et explications neutres, sur le modèle des bonnes pratiques relevées par l'AMF. Les préférences sont affichées mais ne modifient pas l'allocation, qui ne vise aucun produit. Les définitions utilisées sont celles en vigueur ; le règlement SFDR est en cours de révision.</li>
