<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Investype : 16 profils pour découvrir quel investisseur vous êtes vraiment, vos biais et l'allocation d'actifs qui vous ressemble.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Profils d'investisseurs — feuille de style
   Mise en page : une colonne éditoriale de 1080 px max ; le test en plein écran centré ;
   le résultat comme une fiche de fonds (en-tête de profil, jauges, allocation). */
:root {
  --paper: #f3f5f6;
  --surface: #ffffff;
  --sunken: #e8ecef;
  --ink: #132029;
  --muted: #566573;
  --line: #d6dde2;
  --cta: #132029;
  --cta-ink: #ffffff;
  --pat: #2b7a66;   /* Patrimoniaux */
  --tac: #2f63a6;   /* Tacticiens */
  --con: #6a55a8;   /* Conquérants */
  --opp: #c27c12;   /* Opportunistes */
  --good: #2b7a66;
  --warn: #b26a00;
  --ref: #9aa7b1;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e151b; --surface: #16212a; --sunken: #1c2933; --ink: #e5ebef; --muted: #96a5b1;
    --line: #2a3843; --cta: #e5ebef; --cta-ink: #0e151b;
    --pat: #4fb39a; --tac: #6a9be0; --con: #9d8be0; --opp: #e7a541; --good: #4fb39a; --warn: #e7a541; --ref: #5d6c78;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e151b; --surface: #16212a; --sunken: #1c2933; --ink: #e5ebef; --muted: #96a5b1;
  --line: #2a3843; --cta: #e5ebef; --cta-ink: #0e151b;
  --pat: #4fb39a; --tac: #6a9be0; --con: #9d8be0; --opp: #e7a541; --good: #4fb39a; --warn: #e7a541; --ref: #5d6c78;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body {
  margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2.2rem, 5.5vw, 3.6rem); font-weight: 700; }
h2 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 650; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--tac); outline-offset: 3px; border-radius: 6px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--font-data); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.wrap { max-width: 1080px; margin: 0 auto; }
.prose { max-width: 66ch; }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.brand-mark { display: grid; grid-template-columns: repeat(2, 9px); gap: 3px; }
.brand-mark i { width: 9px; height: 9px; border-radius: 2px; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav a { text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: 0.92rem; color: var(--muted); }
.nav a:hover { color: var(--ink); background: var(--sunken); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--sunken); font-weight: 600; }

main { padding-block: 40px 72px; }
section + section { margin-top: 72px; }

/* Boutons */
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 999px; border: 1px solid var(--cta); background: var(--cta); color: var(--cta-ink); font-weight: 600; text-decoration: none; cursor: pointer; transition: transform .15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn .meta { font-family: var(--font-data); font-size: 0.75rem; opacity: 0.75; font-weight: 400; }

/* Accueil */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 48px; align-items: center; }
.hero-text { display: grid; gap: 22px; min-width: 0; }
.hero-text .lead { font-size: 1.15rem; color: var(--muted); max-width: 52ch; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.matrix { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.matrix a { display: grid; place-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 12px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); transition: transform .2s ease, border-color .2s ease; }
.matrix a:hover { transform: translateY(-3px); border-color: var(--ink); }
.matrix .code { font-family: var(--font-data); font-size: 0.72rem; letter-spacing: 0.08em; color: var(--muted); }
.matrix svg { width: 100%; max-width: 72px; height: auto; }
.matrix-legend { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted); font-family: var(--font-data); }

.axes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 24px; }
.axis-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 10px; align-content: start; }
.axis-poles { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; }
.axis-poles .l { font-family: var(--font-data); font-size: 1.3rem; }
.axis-poles .rule { flex: 1; height: 2px; background: linear-gradient(90deg, var(--line), var(--ink), var(--line)); border-radius: 2px; }
.axis-card p { font-size: 0.93rem; color: var(--muted); }

.families { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 24px; }
.family { border-radius: var(--r); padding: 20px; display: grid; gap: 8px; align-content: start; background: color-mix(in srgb, var(--fam) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--fam) 35%, var(--line)); }
.family .tag { font-family: var(--font-data); font-size: 0.8rem; color: var(--fam); font-weight: 600; letter-spacing: 0.06em; }
.family p { font-size: 0.93rem; color: var(--muted); }

.formats { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0; margin-top: 24px; border-top: 1px solid var(--line); }
.formats > div { padding: 18px 20px 18px 0; border-bottom: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.formats p { font-size: 0.93rem; color: var(--muted); }
.sec-head { display: grid; gap: 10px; max-width: 66ch; }

/* Test */
.test { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
.progress { display: grid; gap: 8px; }
.progress-bar { height: 6px; background: var(--sunken); border-radius: 6px; overflow: hidden; }
.progress-bar > i { display: block; height: 100%; background: var(--ink); border-radius: 6px; transition: width .3s ease; }
.progress-meta { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-data); font-size: 0.8rem; color: var(--muted); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(22px, 4vw, 40px); display: grid; gap: 24px; }
.qtag { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--sunken); font-size: 0.78rem; font-family: var(--font-data); color: var(--muted); }
.chip.date { background: color-mix(in srgb, var(--opp) 16%, var(--surface)); color: var(--ink); }
.qtext { font-family: var(--font-display); font-size: clamp(1.25rem, 2.6vw, 1.6rem); font-weight: 600; line-height: 1.3; text-wrap: pretty; }
.likert { display: grid; gap: 14px; }
.likert-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.likert-end { font-size: 0.85rem; font-weight: 600; width: 92px; flex-shrink: 0; }
.likert-end.r { text-align: right; }
.likert-dots { display: flex; align-items: center; justify-content: center; gap: clamp(8px, 2.5vw, 22px); flex: 1; }
.dot { border-radius: 50%; border: 2px solid var(--muted); background: transparent; cursor: pointer; padding: 0; transition: transform .15s ease, background .15s ease; }
.dot:hover { transform: scale(1.08); }
.dot[data-v="1"], .dot[data-v="5"] { width: 50px; height: 50px; }
.dot[data-v="2"], .dot[data-v="4"] { width: 40px; height: 40px; }
.dot[data-v="3"] { width: 30px; height: 30px; }
.dot[data-v="1"], .dot[data-v="2"] { border-color: var(--tac); }
.dot[data-v="4"], .dot[data-v="5"] { border-color: var(--opp); }
.dot[aria-pressed="true"][data-v="1"], .dot[aria-pressed="true"][data-v="2"] { background: var(--tac); }
.dot[aria-pressed="true"][data-v="3"] { background: var(--muted); }
.dot[aria-pressed="true"][data-v="4"], .dot[aria-pressed="true"][data-v="5"] { background: var(--opp); }
.likert-labels { display: none; justify-content: space-between; font-size: 0.8rem; font-weight: 600; }
.options { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; transition: border-color .15s ease, background .15s ease; }
.opt:hover { border-color: var(--ink); }
.opt .k { font-family: var(--font-data); font-size: 0.8rem; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--sunken); flex-shrink: 0; }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--sunken); }
.opt[aria-pressed="true"] .k { background: var(--ink); color: var(--paper); }
.opt.neutral { border-style: dashed; color: var(--muted); }
.test-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.linkbtn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 8px 0; font-size: 0.92rem; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--ink); }
.linkbtn:disabled { opacity: 0.35; cursor: default; }
.kbd-hint { font-size: 0.8rem; color: var(--muted); }

/* Résultat et fiche */
.pcard { --fam: var(--ink); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; padding: clamp(22px, 4vw, 36px); border-radius: 22px; background: color-mix(in srgb, var(--fam) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--fam) 35%, var(--line)); }
.pcard svg.emblem { width: clamp(110px, 18vw, 160px); height: auto; }
.pcard .code-big { font-family: var(--font-data); font-size: clamp(1.5rem, 4vw, 2.1rem); letter-spacing: 0.08em; color: var(--fam); font-weight: 600; }
.pcard .devise { font-family: var(--font-display); font-size: 1.1rem; font-style: italic; color: var(--muted); margin-top: 8px; }
.pcard .fam-label { font-size: 0.9rem; margin-top: 10px; }
.pcard-text { display: grid; gap: 4px; min-width: 0; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.panel h3 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

.gauge { display: grid; gap: 6px; }
.gauge-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.88rem; }
.gauge-head .win { font-weight: 700; }
.gauge-track { position: relative; height: 12px; border-radius: 6px; background: var(--sunken); }
.gauge-fill { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.gauge-mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); opacity: .5; }
.gauge-tick { position: absolute; top: -5px; width: 2px; height: 22px; background: var(--ink); border-radius: 1px; }
.gauge-tick.decl { background: transparent; border-left: 2px dashed var(--ink); width: 0; }
.gauge-foot { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 0.72rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 0; border-top: 2px solid var(--ink); vertical-align: middle; margin-right: 6px; }
.legend i.d { border-top-style: dashed; }

.signals { display: grid; gap: 10px; }
.signal { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 14px; border-radius: 12px; background: var(--sunken); font-size: 0.93rem; }
.signal .pill { font-family: var(--font-data); font-size: 0.72rem; padding: 3px 8px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
.pill.good { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.pill.info { background: color-mix(in srgb, var(--tac) 18%, transparent); color: var(--tac); }

.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.list li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: 0.95rem; }
.list li::before { content: ""; width: 8px; height: 8px; border-radius: 2px; margin-top: 8px; background: var(--fam, var(--ink)); }
.list.minus li::before { background: transparent; border: 2px solid var(--warn); width: 8px; height: 8px; border-radius: 50%; }

.alloc-bar { display: flex; height: 34px; border-radius: 10px; overflow: hidden; gap: 2px; }
.alloc-bar > span { display: grid; place-items: center; font-family: var(--font-data); font-size: 0.72rem; color: #fff; min-width: 0; overflow: hidden; }
.alloc-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.alloc-table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 0.78rem; padding: 0 0 8px; }
.alloc-table td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: middle; }
.alloc-table td.n { width: 44px; text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.alloc-table td.bars { width: 46%; padding-left: 12px; }
.alloc-table .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
.pair { display: grid; gap: 3px; }
.pair i { display: block; height: 7px; border-radius: 4px; }
.pair i.ref { background: var(--ref); height: 4px; }
.delta { font-family: var(--font-data); font-size: 0.75rem; }
.delta.up { color: var(--good); } .delta.down { color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 0.88rem; }
.callout { border-left: 3px solid var(--fam, var(--ink)); padding: 4px 0 4px 16px; display: grid; gap: 4px; }
.callout .eyebrow { color: var(--fam, var(--muted)); }
.disclaimer { font-size: 0.82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; max-width: 80ch; }
.share { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.share input { flex: 1; min-width: 0; font-family: var(--font-data); font-size: 0.78rem; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.toast { font-size: 0.85rem; color: var(--good); }

/* Galerie */
.gallery-fam { display: grid; gap: 16px; }
.gallery-fam + .gallery-fam { margin-top: 48px; }
.gallery-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.gallery-head .tag { font-family: var(--font-data); color: var(--fam); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.pcard-mini { --fam: var(--ink); display: grid; gap: 10px; padding: 20px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-decoration: none; transition: transform .2s ease, border-color .2s ease; align-content: start; }
.pcard-mini:hover { transform: translateY(-3px); border-color: var(--fam); }
.pcard-mini svg { width: 72px; height: auto; }
.pcard-mini .code { font-family: var(--font-data); color: var(--fam); font-weight: 600; letter-spacing: 0.08em; font-size: 0.85rem; }
.pcard-mini p { font-size: 0.88rem; color: var(--muted); }

/* Méthode */
.steps { counter-reset: s; display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; font-size: 0.95rem; }
.steps li::before { content: counter(s); font-family: var(--font-data); font-size: 0.8rem; width: 26px; height: 26px; border-radius: 8px; background: var(--sunken); display: grid; place-items: center; }
.table-wrap { overflow-x: auto; }
.mtable { width: 100%; border-collapse: collapse; font-size: 0.92rem; min-width: 560px; }
.mtable th, .mtable td { text-align: left; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.mtable th { font-size: 0.78rem; color: var(--muted); font-weight: 500; }

footer { border-top: 1px solid var(--line); padding-block: 28px 40px; font-size: 0.85rem; color: var(--muted); }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

@media (max-width: 820px) {
  .hero, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .pcard { grid-template-columns: minmax(0, 1fr); justify-items: start; }
}
@media (max-width: 560px) {
  .likert-end { display: none; }
  .likert-labels { display: flex; }
  .dot[data-v="1"], .dot[data-v="5"] { width: 44px; height: 44px; }
  .dot[data-v="2"], .dot[data-v="4"] { width: 36px; height: 36px; }
  .nav a { padding: 6px 9px; font-size: 0.85rem; }
  .brand span { font-size: 0.95rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Version 1.1 : fiche longue, allocation enrichie */
.story { display: grid; gap: 56px; }
.story-lead { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.prose-lg { display: grid; gap: 18px; font-size: 1.12rem; line-height: 1.7; max-width: 64ch; }
.prose-lg p:first-child::first-letter { font-family: var(--font-display); font-size: 3.2em; float: left; line-height: 0.9; padding: 6px 10px 0 0; color: var(--fam); font-weight: 700; }
.quick { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.chapter { display: grid; gap: 14px; }
.chapter > .eyebrow { color: var(--fam); }
.prose { line-height: 1.7; }
.moment { border-top: 3px solid var(--good); }
.moment.warn { border-top-color: var(--warn); }
.moment .eyebrow { color: var(--good); }
.moment.warn .eyebrow { color: var(--warn); }
.model { display: grid; gap: 4px; padding: 16px 18px; border-radius: var(--r); background: color-mix(in srgb, var(--fam) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--fam) 30%, var(--line)); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.kpis > div { display: grid; gap: 4px; padding: 16px 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); align-content: start; }
.kpi { font-family: var(--font-display); font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpis .muted { font-size: 0.82rem; line-height: 1.4; }
.stack { display: grid; gap: 20px; align-content: start; min-width: 0; }
.small { font-size: 0.82rem; }
.alloc-table tr.grp td { font-family: var(--font-data); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding-top: 14px; border-top: none; }
.crisis { display: grid; gap: 6px; padding-block: 8px; border-top: 1px solid var(--line); }
.crisis:first-of-type { border-top: none; }
.crisis-head { font-size: 0.9rem; }
.crisis-bars { display: grid; gap: 4px; }
.cb { display: grid; grid-template-columns: 52px minmax(0, 1fr) 56px; gap: 10px; align-items: center; font-size: 0.82rem; }
.cb .mono { text-align: right; }
.cb-track { height: 8px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
.cb-track i { display: block; height: 100%; border-radius: 4px; }
.factor { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.9rem; padding-block: 4px; }
.fdots { display: flex; gap: 6px; }
.fdots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); }
.fdots i.zero { border-style: dashed; }
.fdots i.on { background: var(--fam); border-color: var(--fam); }
.flegend { display: flex; justify-content: flex-end; gap: 52px; font-family: var(--font-data); font-size: 0.7rem; color: var(--muted); }
.rels { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 8px; }
.rel { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-decoration: none; font-size: 0.9rem; transition: border-color .2s ease; }
.rel:hover { border-color: var(--fam); }
.rel svg { width: 56px; height: auto; }
.rel .eyebrow { display: block; color: var(--fam); }
@media (max-width: 820px) {
  .story-lead { grid-template-columns: minmax(0, 1fr); }
  .quick { position: static; }
  .kpis { grid-template-columns: minmax(0, 1fr); }
}

(function () {
  "use strict";
  const Q = window.QUESTIONS, AXES = window.AXES, P = window.PROFILS, F = window.FAMILLES;
  const CL = window.CLASSES, REF = window.REFERENCE, S = window.Scoring;
  const app = document.getElementById("app");
  const AX4 = AXES.filter(a => a.id !== "X");
  const FAM_VAR = { SL: "--pat", SC: "--tac", OL: "--con", OC: "--opp" };
  const famOf = code => code.slice(0, 2);
  const famColor = code => `var(${FAM_VAR[famOf(code)]})`;
  const FORMAT_LABEL = { decl: "Déclaratif", sit: "Mise en situation", chif: "Arbitrage chiffré", passe: "Comportement passé" };

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* idem */ } }
  };

  /* ---------- Emblème : forme = horizon, glyphe = méthode, chevrons = consensus, étincelle = offensive ---------- */
  function emblem(code, cls) {
    const off = code[0] === "O", court = code[1] === "C", intu = code[2] === "I", tend = code[3] === "T";
    const outer = court
      ? `<path d="M60 8 L112 60 L60 112 L8 60 Z" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>`
      : `<circle cx="60" cy="60" r="51" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3.5"/>`;
    const glyph = intu
      ? `<path d="M34 50 C42 40 50 40 58 50 S74 60 86 50" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
         <path d="M34 62 C42 52 50 52 58 62 S74 72 86 62" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity=".55"/>`
      : `<rect x="38" y="56" width="9" height="12" rx="2" fill="currentColor"/><rect x="51" y="47" width="9" height="21" rx="2" fill="currentColor"/><rect x="64" y="38" width="9" height="30" rx="2" fill="currentColor"/><rect x="77" y="52" width="6" height="16" rx="2" fill="currentColor" opacity=".45"/>`;
    const chev = (x, rev) => rev
      ? `<path d="M${x + 6} 78 L${x} 84 L${x + 6} 90" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`
      : `<path d="M${x} 78 L${x + 6} 84 L${x} 90" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`;
    const chevrons = chev(44, false) + chev(56, false) + (tend ? chev(68, false) : chev(68, true));
    const spark = off ? `<path d="M92 14 L95 23 L104 26 L95 29 L92 38 L89 29 L80 26 L89 23 Z" fill="currentColor"/>` : "";
    return `<svg class="emblem ${cls || ""}" viewBox="0 0 120 120" style="color:${famColor(code)}" role="img" aria-label="Emblème du profil ${code}">${outer}${glyph}${chevrons}${spark}</svg>`;
  }

  /* ---------- Routeur ---------- */
  function route() {
    const h = decodeURIComponent((location.hash || "").slice(1));
    document.querySelectorAll(".nav a").forEach(a => a.removeAttribute("aria-current"));
    const mark = id => { const a = document.querySelector(`.nav a[data-nav="${id}"]`); if (a) a.setAttribute("aria-current", "page"); };
    if (h === "test-complet") { mark("test"); return renderTest("f"); }
    if (h === "test-court") { mark("test"); return renderTest("c"); }
    if (h.startsWith("r-")) { const r = S.decode(h); if (r) return renderResult(r); }
    if (h === "profils") { mark("profils"); return renderGallery(); }
    if (h.startsWith("profil-") && P[h.slice(7)]) { mark("profils"); return renderProfile(h.slice(7)); }
    if (h === "methode") { mark("methode"); return renderMethod(); }
    renderHome();
  }
  function show(html) { app.innerHTML = html; window.scrollTo(0, 0); }

  /* ---------- Accueil ---------- */
  function renderHome() {
    const order = ["SL", "SC", "OL", "OC"];
    const codes = order.flatMap(f => Object.keys(P).filter(c => famOf(c) === f));
    const last = store.get("pi-dernier");
    show(`
      <section class="hero">
        <div class="hero-text">
          <span class="eyebrow">Investype · 16 profils pour découvrir quel investisseur vous êtes vraiment</span>
          <h1>Quel investisseur êtes-vous vraiment ?</h1>
          <p class="lead">Quatre axes, des mises en situation tirées de vraies crises de marché, et une confrontation entre ce que vous dites et ce que vous feriez. À la clé : votre profil, vos biais, et l'allocation d'actifs qui vous ressemble.</p>
          <div class="actions">
            <a class="btn" href="#test-complet">Passer le test complet <span class="meta">56 questions · 12 min</span></a>
            <a class="btn ghost" href="#test-court">Version courte <span class="meta">16 questions · 4 min</span></a>
          </div>
          ${last ? `<p class="muted">Votre dernier résultat : <a href="#${last.token}"><strong class="mono">${last.code}</strong> · ${P[last.code.slice(0, 4)].nom}</a></p>` : ""}
        </div>
        <div>
          <div class="matrix" aria-label="Les 16 profils">
            ${codes.map(c => `<a href="#profil-${c}" title="${P[c].nom}">${emblem(c)}<span class="code">${c}</span></a>`).join("")}
          </div>
          <div class="matrix-legend">${order.map(f => `<span style="color:var(${FAM_VAR[f]})">● ${F[f].nom.replace("Les ", "")}</span>`).join("")}</div>
        </div>
      </section>

      <section>
        <div class="sec-head">
          <span class="eyebrow">La grille</span>
          <h2>Quatre axes, deux lettres chacun</h2>
          <p class="muted">Votre code combine une lettre par axe. Chaque axe est mesuré de 0 à 100 : vous voyez de quel côté vous penchez, et avec quelle intensité.</p>
        </div>
        <div class="axes">
          ${axisCard("R", "Votre rapport à la perte et à la volatilité : préserver le capital, ou accepter les secousses pour aller chercher le rendement.")}
          ${axisCard("H", "Votre patience : laisser le temps travailler, ou ajuster souvent pour saisir les mouvements.")}
          ${axisCard("M", "Votre manière de décider : par les chiffres et les modèles, ou par le flair et le récit.")}
          ${axisCard("C", "Votre position face à la foule : acheter ce que les autres délaissent, ou suivre la tendance.")}
        </div>
        <p class="muted" style="margin-top:16px">Un suffixe complète le code : <strong>-D Discipliné</strong> ou <strong>-R Réactif</strong>, selon que vous tenez vos règles sous le stress.</p>
      </section>

      <section>
        <div class="sec-head">
          <span class="eyebrow">Les familles</span>
          <h2>Quatre familles d'investisseurs</h2>
        </div>
        <div class="families">
          ${order.map(f => `<a class="family" href="#profils" style="--fam:var(${FAM_VAR[f]});text-decoration:none"><span class="tag">${f}</span><h3>${F[f].nom}</h3><p>${F[f].desc}</p></a>`).join("")}
        </div>
      </section>

      <section>
        <div class="sec-head">
          <span class="eyebrow">Pourquoi ce test est différent</span>
          <h2>On ne se contente pas de vous croire sur parole</h2>
          <p class="muted">Les questionnaires de profil de risque reposent presque tous sur l'auto-évaluation. Ici, quatre formats de questions se recoupent.</p>
        </div>
        <div class="formats">
          <div><span class="eyebrow">Déclaratif</span><h3>Ce que vous pensez de vous</h3><p>Des affirmations à noter sur cinq niveaux d'accord.</p></div>
          <div><span class="eyebrow">Mise en situation</span><h3>Bulle internet, 2008, 2020, 2022</h3><p>Ce que vous feriez face à de vraies crises de marché.</p></div>
          <div><span class="eyebrow">Arbitrage chiffré</span><h3>Pile ou face</h3><p>Des choix entre un gain certain et un pari, qui révèlent votre aversion aux pertes.</p></div>
          <div><span class="eyebrow">Comportement passé</span><h3>Ce que vous avez fait</h3><p>Les décisions que vous avez réellement prises.</p></div>
        </div>
        <p class="muted" style="margin-top:16px">Le résultat compare votre score déclaré et votre score révélé sur chaque axe, et mesure la cohérence de vos réponses.</p>
      </section>
    `);
  }
  function axisCard(id, text) {
    const a = AXES.find(x => x.id === id);
    return `<div class="axis-card"><span class="eyebrow">${a.nom}</span>
      <div class="axis-poles"><span><span class="l">${a.p1.l}</span> ${a.p1.n}</span><span class="rule"></span><span>${a.p2.n} <span class="l">${a.p2.l}</span></span></div>
      <p>${text}</p></div>`;
  }

  /* ---------- Test ---------- */
  function buildOrder(mode) {
    if (mode === "c") {
      const ids = window.COURTE;
      const per = AX4.map(a => ids.filter(i => i[0] === a.id));
      const out = [];
      for (let i = 0; i < 4; i++) per.forEach(l => l[i] && out.push(l[i]));
      return out;
    }
    const pat12 = [0, 4, 8, 10, 1, 5, 2, 6, 9, 11, 3, 7], pat8 = [0, 4, 6, 1, 5, 2, 7, 3];
    const per = AXES.map(a => {
      const qs = Q.filter(q => q.axe === a.id).map(q => q.id);
      return (qs.length === 12 ? pat12 : pat8).map(i => qs[i]);
    });
    const out = [];
    for (let i = 0; i < 12; i++) per.forEach(l => l[i] && out.push(l[i]));
    return out;
  }
  function seeded(id, n) {
    let h = 2166136261;
    for (const c of id) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
    const idx = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 13), 1274126177); const j = Math.abs(h) % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    return idx;
  }

  let T = null;
  function renderTest(mode) {
    const key = "pi-progress-" + mode;
    const saved = store.get(key);
    const order = buildOrder(mode);
    T = { mode, key, order, answers: (saved && saved.answers) || {}, i: 0 };
    const firstOpen = order.findIndex(id => T.answers[id] === undefined);
    T.i = firstOpen === -1 ? order.length - 1 : firstOpen;
    drawQuestion();
  }
  function drawQuestion() {
    const id = T.order[T.i], q = Q.find(x => x.id === id), n = T.order.length;
    const done = Object.keys(T.answers).filter(k => T.order.includes(k)).length;
    const ax = AXES.find(a => a.id === q.axe);
    const a = T.answers[id];
    let body;
    if (q.type === "decl") {
      body = `<div class="likert" role="group" aria-label="Votre degré d'accord">
        <div class="likert-row"><span class="likert-end" style="color:var(--tac)">Pas du tout d'accord</span>
          <div class="likert-dots">${[1, 2, 3, 4, 5].map(v => `<button class="dot" data-v="${v}" aria-pressed="${a === v}" aria-label="${["Pas du tout d'accord", "Plutôt pas d'accord", "Neutre", "Plutôt d'accord", "Tout à fait d'accord"][v - 1]}"></button>`).join("")}</div>
          <span class="likert-end r" style="color:var(--opp)">Tout à fait d'accord</span></div>
        <div class="likert-labels"><span style="color:var(--tac)">Pas d'accord</span><span style="color:var(--opp)">D'accord</span></div>
      </div>`;
    } else {
      const perm = seeded(id, q.options.length);
      body = `<div class="options">${perm.map((oi, k) => `<button class="opt" data-o="${oi}" aria-pressed="${a === oi}"><span class="k">${"ABCD"[k]}</span><span>${q.options[oi].t}</span></button>`).join("")}
        ${q.neutre ? `<button class="opt neutral" data-o="n" aria-pressed="${a === "n"}"><span class="k">–</span><span>${q.neutre}</span></button>` : ""}</div>`;
    }
    show(`<div class="test">
      <div class="progress">
        <div class="progress-meta"><span>${T.mode === "f" ? "Test complet" : "Version courte"} · question ${T.i + 1} sur ${n}</span><span>${Math.round(done / n * 100)} %</span></div>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${done}"><i style="width:${done / n * 100}%"></i></div>
      </div>
      <div class="qcard">
        <div class="qtag"><span class="chip">${FORMAT_LABEL[q.type]}</span>${q.contexte ? `<span class="chip date">${q.contexte}</span>` : ""}<span class="chip">Axe ${ax.nom.toLowerCase()}</span></div>
        <p class="qtext" id="qtext">${q.texte}</p>
        ${body}
      </div>
      <div class="test-nav">
        <button class="linkbtn" id="prev" ${T.i === 0 ? "disabled" : ""}>← Question précédente</button>
        <span class="kbd-hint">${q.type === "decl" ? "Touches 1 à 5" : "Touches A à D"}</span>
        <button class="linkbtn" id="restart">Recommencer</button>
      </div>
    </div>`);
    app.querySelectorAll(".dot").forEach(b => b.addEventListener("click", () => answer(+b.dataset.v)));
    app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(b.dataset.o === "n" ? "n" : +b.dataset.o)));
    document.getElementById("prev").addEventListener("click", () => { if (T.i > 0) { T.i--; drawQuestion(); } });
    document.getElementById("restart").addEventListener("click", () => { store.del(T.key); T.answers = {}; T.i = 0; drawQuestion(); });
  }
  function answer(v) {
    const id = T.order[T.i];
    T.answers[id] = v;
    store.set(T.key, { answers: T.answers });
    app.querySelectorAll(".dot,.opt").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.v ? +b.dataset.v : (b.dataset.o === "n" ? "n" : +b.dataset.o)) === v)));
    setTimeout(() => {
      const next = T.order.findIndex((qid, k) => k > T.i && T.answers[qid] === undefined);
      const anyOpen = T.order.findIndex(qid => T.answers[qid] === undefined);
      if (next !== -1) { T.i = next; drawQuestion(); }
      else if (anyOpen !== -1) { T.i = anyOpen; drawQuestion(); }
      else finish();
    }, 220);
  }
  function finish() {
    const qs = Q.filter(q => T.order.includes(q.id));
    const res = S.calc(qs, T.answers, AXES, window.PAIRES);
    const token = S.encode(T.mode, res);
    const suf = S.suffixe(res.axes);
    store.set("pi-dernier", { token, code: S.code(res.axes) + (suf ? "-" + suf : "") });
    store.del(T.key);
    T = null;
    location.hash = token;
  }
  document.addEventListener("keydown", e => {
    if (!T || !location.hash.startsWith("#test") || e.metaKey || e.ctrlKey || e.altKey) return;
    const q = Q.find(x => x.id === T.order[T.i]);
    if (e.key === "ArrowLeft" || e.key === "Backspace") { if (T.i > 0) { e.preventDefault(); T.i--; drawQuestion(); } return; }
    if (q.type === "decl" && /^[1-5]$/.test(e.key)) return answer(+e.key);
    if (q.type !== "decl") {
      const k = "abcd".indexOf(e.key.toLowerCase());
      const k2 = "1234".indexOf(e.key);
      const pos = k !== -1 ? k : k2;
      if (pos !== -1) return answer(seeded(q.id, q.options.length)[pos]);
    }
  });

  /* ---------- Blocs partagés résultat / fiche ---------- */
  const TX = window.TEXTES, CR = window.CRISES, FA = window.FACTEURS;
  const flip = (code, idx) => code.split("").map((ch, i) => idx.includes(i) ? AX4[i].p1.l === ch ? AX4[i].p2.l : AX4[i].p1.l : ch).join("");
  function stats(alloc) {
    let er = 0, w = 0;
    CL.forEach(c => { if (c.r !== null) { er += alloc[c.id] * c.r; w += alloc[c.id]; } });
    return {
      ret: er / w,
      crises: [0, 1, 2].map(i => CL.reduce((t, c) => t + alloc[c.id] * c.c[i], 0) / 100),
      actions: alloc.ACTD + alloc.ACTE + alloc.SMALL
    };
  }
  const fmt = (x, d) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d || 0).replace(".", ",");
  const darkText = hex => { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 150; };

  function profileBlocks(code) {
    const p = P[code], t = TX[code], fam = famColor(code);
    const ally = flip(code, [2, 3]), cousin = flip(code, [0]), contra = flip(code, [0, 1, 2, 3]);
    const mini = (c, label, why) => `<a class="rel" href="#profil-${c}" style="--fam:${famColor(c)}">${emblem(c)}<span><span class="eyebrow">${label}</span><strong>${P[c].nom}</strong> <span class="mono muted">${c}</span><br><span class="muted">${why}</span></span></a>`;
    return `
    <div class="story" style="--fam:${fam}">
      <section class="story-lead">
        <div class="prose-lg">${t.qui.map(x => `<p>${x}</p>`).join("")}</div>
        <aside class="panel quick">
          <h3>En un coup d'œil</h3>
          <span class="eyebrow">Forces</span><ul class="list">${p.forces.map(x => `<li>${x}</li>`).join("")}</ul>
          <span class="eyebrow">Biais à surveiller</span><ul class="list minus">${p.biais.map(x => `<li>${x}</li>`).join("")}</ul>
        </aside>
      </section>

      <section class="chapter"><span class="eyebrow">Chapitre 1</span><h2>Comment vous décidez</h2><p class="prose">${t.decision}</p></section>

      <section class="chapter"><span class="eyebrow">Chapitre 2</span><h2>Vos grands moments de marché</h2>
        <div class="grid2">
          <div class="panel moment good"><span class="eyebrow">Votre plus beau moment</span><p>${t.meilleur}</p></div>
          <div class="panel moment warn"><span class="eyebrow">Votre pire moment</span><p>${t.pire}</p></div>
        </div></section>

      <section class="chapter"><span class="eyebrow">Chapitre 3</span><h2>Ce que les autres voient de vous</h2><p class="prose">${t.regard}</p></section>

      ${allocationBlock(code)}

      <section class="chapter"><span class="eyebrow">Chapitre 5</span><h2>Ce qui vous fait perdre de l'argent</h2>
        <p class="prose">${t.pertes}</p>
        <div class="callout" style="margin-top:12px"><span class="eyebrow">Le scénario qui vous met à l'épreuve</span><p>${p.danger}</p></div>
        <p class="prose muted" style="margin-top:12px"><strong>Votre angle mort.</strong> ${p.angleMort}</p></section>

      <section class="chapter"><span class="eyebrow">Chapitre 6</span><h2>Votre garde-fou et vos règles</h2>
        <div class="grid2">
          <div class="panel"><h3>Le garde-fou</h3><p>${t.gardeFouTexte}</p></div>
          <div class="panel"><h3>Trois règles de discipline</h3><ol class="steps">${p.regles.map(x => `<li>${x}</li>`).join("")}</ol></div>
        </div></section>

      <section class="chapter"><span class="eyebrow">Chapitre 7</span><h2>Les investisseurs qui vous ressemblent</h2><p class="prose">${t.ressemblent}</p></section>

      <section class="chapter"><span class="eyebrow">Chapitre 8</span><h2>Vos alliés et vos contradicteurs</h2>
        <p class="prose">${t.comite}</p>
        <div class="rels">
          ${mini(ally, "Allié naturel", "Même rapport au risque et au temps, autre manière de décider.")}
          ${mini(cousin, "Cousin", "Même méthode, appétit pour le risque opposé.")}
          ${mini(contra, "Contradicteur", "Votre opposé sur les quatre axes.")}
        </div></section>
    </div>`;
  }

  function allocationBlock(code) {
    const p = P[code], t = TX[code], st = stats(p.alloc), rs = stats(REF.alloc);
    const bar = CL.filter(c => p.alloc[c.id] > 0).map(c => `<span style="width:${p.alloc[c.id]}%;background:${c.couleur};color:${darkText(c.couleur) ? "#132029" : "#fff"}" title="${c.nom} : ${p.alloc[c.id]} %">${p.alloc[c.id] >= 7 ? p.alloc[c.id] + "%" : ""}</span>`).join("");
    const groups = [...new Set(CL.map(c => c.groupe))];
    const rows = groups.map(g => {
      const cls = CL.filter(c => c.groupe === g && (p.alloc[c.id] > 0 || REF.alloc[c.id] > 0));
      if (!cls.length) return "";
      return `<tr class="grp"><td colspan="4">${g}</td></tr>` + cls.map(c => {
        const v = p.alloc[c.id], r = REF.alloc[c.id], d = v - r;
        return `<tr><td><span class="sw" style="background:${c.couleur}"></span>${c.nom}</td><td class="n">${v} %</td>
          <td class="bars"><div class="pair"><i style="width:${Math.min(v * 1.5, 100)}%;background:${c.couleur}"></i><i class="ref" style="width:${Math.min(r * 1.5, 100)}%"></i></div></td>
          <td class="n"><span class="delta ${d > 0 ? "up" : d < 0 ? "down" : ""}">${d === 0 ? "=" : fmt(d)}</span></td></tr>`;
      }).join("");
    }).join("");
    const crisisRows = CR.map((c, i) => {
      const a = st.crises[i], b = rs.crises[i], maxv = 45;
      return `<div class="crisis"><div class="crisis-head"><span><strong>${c.nom}</strong> <span class="muted">${c.periode}</span></span></div>
        <div class="crisis-bars">
          <div class="cb"><span class="cb-l">Vous</span><span class="cb-track"><i style="width:${Math.min(Math.abs(a) / maxv * 100, 100)}%;background:${a < 0 ? "var(--warn)" : "var(--good)"}"></i></span><span class="mono">${fmt(a)} %</span></div>
          <div class="cb"><span class="cb-l muted">60/40</span><span class="cb-track"><i style="width:${Math.min(Math.abs(b) / maxv * 100, 100)}%;background:var(--ref)"></i></span><span class="mono muted">${fmt(b)} %</span></div>
        </div></div>`;
    }).join("");
    const dots = v => [-2, -1, 0, 1, 2].map(k => `<i class="${k === v ? "on" : ""} ${k === 0 ? "zero" : ""}"></i>`).join("");
    const factors = FA.map(f => { const v = p.facteurs[f.id]; return `<div class="factor"><span>${f.nom}</span><span class="fdots" aria-label="${f.nom} : ${v > 0 ? "surpondéré" : v < 0 ? "sous-pondéré" : "neutre"}">${dots(v)}</span></div>`; }).join("");
    return `<section class="chapter" style="--fam:${famColor(code)}">
      <span class="eyebrow">Chapitre 4</span><h2>L'allocation qui vous ressemble</h2>
      <p class="prose">${t.actifsPourquoi}</p>

      <div class="model"><span class="eyebrow">Portefeuille de référence</span><strong>${p.modele.nom}</strong><span class="muted">${p.modele.desc}</span></div>

      <div class="kpis">
        <div><span class="eyebrow">Rendement attendu</span><span class="kpi">${fmt(st.ret, 1)} %</span><span class="muted">par an sur 10 ans, hors crypto-actifs<br>60/40 : ${fmt(rs.ret, 1)} %</span></div>
        <div><span class="eyebrow">Actions</span><span class="kpi">${st.actions} %</span><span class="muted">du portefeuille<br>60/40 : ${rs.actions} %</span></div>
        <div><span class="eyebrow">Pire crise estimée</span><span class="kpi">${fmt(Math.min(...st.crises))} %</span><span class="muted">sur les trois épisodes<br>60/40 : ${fmt(Math.min(...rs.crises))} %</span></div>
      </div>

      <div class="grid2" style="margin-top:20px">
        <div class="panel">
          <h3>Allocation naturelle <span class="eyebrow">${code}</span></h3>
          <div class="alloc-bar" role="img" aria-label="Allocation naturelle du profil ${code}">${bar}</div>
          <div class="table-wrap"><table class="alloc-table"><thead><tr><th>Classe d'actifs</th><th style="text-align:right">Poids</th><th style="padding-left:12px">Vous / 60/40</th><th style="text-align:right">Écart</th></tr></thead><tbody>${rows}</tbody></table></div>
          <p class="muted small">${p.note}</p>
        </div>
        <div class="stack">
          <div class="panel"><h3>À l'épreuve des crises</h3>${crisisRows}
            <p class="muted small">Performance estimée de l'allocation sur chaque épisode, en euros, comparée à un portefeuille 60/40. Ordres de grandeur.</p></div>
          <div class="panel"><h3>Votre poche actions</h3><div class="flegend"><span>Sous-pondéré</span><span>Surpondéré</span></div>${factors}</div>
        </div>
      </div>

      <div class="grid2" style="margin-top:20px">
        <div class="panel"><h3>Vos actifs préférés</h3><div class="chips">${p.actifs.map(a => `<span>${a}</span>`).join("")}</div></div>
        <div class="panel"><div class="callout"><span class="eyebrow">Garde-fou en une ligne</span><p>${p.gardeFou}</p></div>
          <p class="muted small">Ces allocations décrivent un tempérament. Elles ne tiennent compte ni de votre patrimoine, ni de vos revenus, ni de votre horizon réel, et ne constituent pas un conseil en investissement.</p></div>
      </div>
    </section>`;
  }

  /* ---------- Résultat ---------- */
  function gauge(axId, r, friend) {
    const a = AXES.find(x => x.id === axId), s = r.score;
    const win = s > 50 ? a.p2 : a.p1, pct = s > 50 ? s : 100 - s;
    const color = s > 50 ? "var(--opp)" : "var(--tac)";
    const fill = s > 50 ? `left:50%;width:${s - 50}%` : `left:${s}%;width:${50 - s}%`;
    const ticks = (r.rev !== null && r.decl !== null)
      ? `<span class="gauge-tick" style="left:calc(${r.rev}% - 1px)" title="Révélé : ${r.rev}"></span><span class="gauge-tick decl" style="left:calc(${r.decl}% - 1px)" title="Déclaré : ${r.decl}"></span>` : "";
    const ft = friend ? `<span class="gauge-tick" style="left:calc(${friend.score}% - 1px);background:var(--con);height:28px;top:-8px" title="Comparaison : ${friend.score}"></span>` : "";
    return `<div class="gauge">
      <div class="gauge-head"><span>${a.nom}</span><span><span class="win">${pct} % ${win.n}</span> <span class="mono muted">(${win.l})</span></span></div>
      <div class="gauge-track"><span class="gauge-fill" style="${fill};background:${color}"></span><span class="gauge-mid"></span>${ticks}${ft}</div>
      <div class="gauge-foot"><span>${a.p1.l} · ${a.p1.n}</span><span>${a.p2.n} · ${a.p2.l}</span></div></div>`;
  }
  function signals(r) {
    const out = [];
    if (r.coherence !== null) {
      const c = r.coherence;
      out.push(c >= 75 ? `<div class="signal"><span class="pill good">Cohérence ${c}</span><span>Vos réponses aux questions miroirs se recoupent bien. Le profil est fiable.</span></div>`
        : c >= 60 ? `<div class="signal"><span class="pill info">Cohérence ${c}</span><span>Quelques réponses se contredisent légèrement. Le profil reste exploitable.</span></div>`
        : `<div class="signal"><span class="pill warn">Cohérence ${c}</span><span>Plusieurs réponses se contredisent. Repassez le test au calme avant d'en tirer des conclusions.</span></div>`);
    }
    for (const a of AXES) {
      const x = r.axes[a.id];
      if (!x || x.decl === null || x.rev === null) continue;
      const g = x.rev - x.decl;
      if (Math.abs(g) > 20) {
        const vers = g > 0 ? a.p2.n : a.p1.n;
        out.push(`<div class="signal"><span class="pill warn">Écart ${g > 0 ? "+" : ""}${g}</span><span>Axe ${a.nom.toLowerCase()} : en situation, vous agissez plus « ${vers.toLowerCase()} » que vous ne le déclarez (déclaré ${x.decl}, révélé ${x.rev}).</span></div>`);
      }
    }
    if (out.length < 2 && r.mode === "f") out.push(`<div class="signal"><span class="pill good">Aligné</span><span>Sur tous les axes, ce que vous déclarez et ce que vous feriez concordent à moins de 20 points près.</span></div>`);
    return out.join("");
  }
  function renderResult(r, friendToken) {
    const code = S.code(r.axes), suf = S.suffixe(r.axes), p = P[code];
    const friend = friendToken ? S.decode(friendToken) : null;
    const vois = S.voisins(r.axes);
    const fcode = friend ? S.code(friend.axes) : null;
    const common = friend ? [...code].filter((ch, i) => ch === fcode[i]).length : 0;
    show(`
      <div class="pcard" style="--fam:${famColor(code)}">
        ${emblem(code)}
        <div class="pcard-text">
          <span class="eyebrow">Votre profil d'investisseur</span>
          <div class="code-big">${code}${suf ? "-" + suf : ""}</div>
          <h1>${p.nom}</h1>
          <p class="devise">« ${p.devise} »</p>
          <p class="fam-label">Famille <strong>${F[famOf(code)].nom.replace("Les ", "des ")}</strong> · ${suf === "R" ? "tempérament réactif" : suf === "D" ? "tempérament discipliné" : "suffixe non mesuré (version courte)"}</p>
        </div>
      </div>

      <section style="margin-top:32px">
        <div class="grid2">
          <div class="panel">
            <h3>Vos axes ${friend ? `<span class="eyebrow" style="color:var(--con)">comparé à ${fcode}</span>` : ""}</h3>
            ${AX4.map(a => gauge(a.id, r.axes[a.id], friend && friend.axes[a.id])).join("")}
            ${r.axes.X ? gauge("X", r.axes.X, friend && friend.axes.X) : ""}
            <div class="legend"><span><i></i>Score révélé</span><span><i class="d"></i>Score déclaré</span>${friend ? `<span><i style="border-color:var(--con)"></i>Comparaison</span>` : ""}</div>
          </div>
          <div class="panel">
            <h3>Ce que révèlent vos réponses</h3>
            <div class="signals">${signals(r)}</div>
            ${vois.length ? `<p class="muted" style="font-size:.92rem">Profil${vois.length > 1 ? "s" : ""} voisin${vois.length > 1 ? "s" : ""}, car un axe est proche de l'équilibre : ${vois.map(v => `<a href="#profil-${v.code}"><strong class="mono">${v.code}</strong> ${P[v.code].nom}</a>`).join(", ")}.</p>` : ""}
            ${suf ? `<div class="callout" style="--fam:${suf === "R" ? "var(--warn)" : "var(--good)"}"><span class="eyebrow">${suf === "R" ? "Suffixe -R · Réactif" : "Suffixe -D · Discipliné"}</span><p>${suf === "R" ? "Vos émotions pèsent sur vos décisions quand le marché bouge vite. Vos règles de discipline et votre garde-fou sont à appliquer en priorité." : "Vous tenez vos règles quand le marché s'agite. C'est un avantage décisif : la plupart des pertes évitables viennent de décisions prises sous le stress."}</p></div>` : `<p class="muted" style="font-size:.92rem">La version courte ne mesure ni la discipline sous stress ni la cohérence. <a href="#test-complet">Passer le test complet</a>.</p>`}
            ${friend ? `<p style="font-size:.92rem"><strong>${common} lettre${common > 1 ? "s" : ""} sur 4 en commun</strong> avec ${fcode} (${P[fcode].nom}).</p>` : ""}
          </div>
        </div>
      </section>

      <div style="margin-top:40px">${profileBlocks(code)}</div>

      <section style="margin-top:56px">
        <div class="grid2">
          <div class="panel"><h3>Partager votre résultat</h3>
            <p class="muted" style="font-size:.92rem">Votre code de résultat contient vos scores. Envoyez-le à vos amis pour comparer vos profils.</p>
            <div class="share"><input id="share-code" readonly value="${r.token}" aria-label="Code de résultat"><button class="btn ghost" id="copy">Copier</button></div>
            <span class="toast" id="toast" aria-live="polite"></span>
          </div>
          <div class="panel"><h3>Comparer avec un ami</h3>
            <p class="muted" style="font-size:.92rem">Collez le code de résultat ou le lien d'un ami : ses scores s'affichent sur vos jauges.</p>
            <form class="share" id="cmp"><input id="cmp-code" placeholder="r-f-…" aria-label="Code de résultat d'un ami"><button class="btn ghost" type="submit">Comparer</button></form>
            <span class="toast" id="cmp-msg" aria-live="polite"></span>
          </div>
        </div>
        <div class="actions" style="margin-top:24px"><a class="btn" href="#test-complet">Refaire le test</a><a class="btn ghost" href="#profils">Voir les 16 profils</a></div>
      </section>
      <p class="disclaimer" style="margin-top:40px">Ce test est un outil de connaissance de soi et de sensibilisation aux biais comportementaux. Il ne constitue ni un questionnaire d'adéquation réglementaire, ni un conseil en investissement. Il mesure votre tempérament face au risque, pas votre capacité financière à supporter des pertes. Aucune donnée n'est envoyée : vos réponses restent dans votre navigateur.</p>
    `);
    document.getElementById("copy").addEventListener("click", () => {
      const inp = document.getElementById("share-code"), t = document.getElementById("toast");
      const val = inp.value;
      const ok = () => { t.textContent = "Code copié."; };
      const fail = () => { inp.select(); t.textContent = "Code sélectionné : copiez-le avec Ctrl+C ou ⌘C."; };
      try { navigator.clipboard.writeText(val).then(ok, fail); } catch (e) { fail(); }
    });
    document.getElementById("cmp").addEventListener("submit", e => {
      e.preventDefault();
      const v = document.getElementById("cmp-code").value, m = document.getElementById("cmp-msg");
      if (!S.decode(v)) { m.style.color = "var(--warn)"; m.textContent = "Ce code n'est pas reconnu. Il commence par r-f- ou r-c-, suivi de 16 nombres."; return; }
      renderResult(r, v);
    });
  }

  /* ---------- Galerie et fiche ---------- */
  function renderGallery() {
    show(`<div class="sec-head"><span class="eyebrow">Galerie</span><h1>Les 16 profils</h1>
      <p class="muted">Quatre familles, définies par le rapport au risque et l'horizon. Dans chaque famille, la méthode de décision et le rapport au consensus dessinent quatre tempéraments.</p></div>
      <div style="margin-top:40px">${["SL", "SC", "OL", "OC"].map(f => `
        <div class="gallery-fam" style="--fam:var(${FAM_VAR[f]})">
          <div class="gallery-head"><span class="tag">${f}</span><h2>${F[f].nom}</h2></div>
          <p class="muted prose">${F[f].desc}</p>
          <div class="cards">${Object.keys(P).filter(c => famOf(c) === f).map(c => `
            <a class="pcard-mini" href="#profil-${c}" style="--fam:${famColor(c)}">${emblem(c)}<span class="code">${c}</span><h3>${P[c].nom}</h3><p>${P[c].devise}</p></a>`).join("")}</div>
        </div>`).join("")}</div>`);
  }
  function renderProfile(code) {
    const p = P[code];
    const letters = AX4.map((a, i) => { const pole = code[i] === a.p1.l ? a.p1 : a.p2; return `<span class="chip">${a.nom} · <strong>${pole.l}</strong> ${pole.n}</span>`; }).join("");
    show(`<div class="pcard" style="--fam:${famColor(code)}">${emblem(code)}
        <div class="pcard-text"><span class="eyebrow">${F[famOf(code)].nom}</span><div class="code-big">${code}</div><h1>${p.nom}</h1><p class="devise">« ${p.devise} »</p>
        <div class="qtag" style="margin-top:12px">${letters}</div></div></div>
      <div style="margin-top:40px">${profileBlocks(code)}</div>
      <div class="actions" style="margin-top:32px"><a class="btn" href="#test-complet">Découvrir mon profil</a><a class="btn ghost" href="#profils">Tous les profils</a></div>`);
  }

  /* ---------- Méthode ---------- */
  function renderMethod() {
    show(`<div class="sec-head"><span class="eyebrow">Méthode</span><h1>Comment le test fonctionne</h1>
      <p class="muted">Le test s'appuie sur la finance comportementale. Il mesure quatre dimensions du tempérament d'investisseur et une cinquième, la discipline sous stress, qui détermine souvent la performance réelle.</p></div>
      <section style="margin-top:40px"><h2>Les axes</h2>
        <div class="table-wrap" style="margin-top:16px"><table class="mtable"><thead><tr><th>Axe</th><th>Pôle 1</th><th>Pôle 2</th><th>Ce qui est mesuré</th></tr></thead><tbody>
          <tr><td>Risque</td><td>S · Sécurité</td><td>O · Offensive</td><td>Tolérance psychologique à la perte, aversion aux pertes, rapport à la volatilité</td></tr>
          <tr><td>Horizon</td><td>L · Long terme</td><td>C · Court terme</td><td>Patience, préférence temporelle, fréquence de décision</td></tr>
          <tr><td>Méthode</td><td>A · Analyse</td><td>I · Intuition</td><td>Décision par les données et les modèles, ou par le flair et le récit</td></tr>
          <tr><td>Consensus</td><td>D · Divergent</td><td>T · Tendance</td><td>Contrarianisme, ou suivi du momentum et de la foule</td></tr>
          <tr><td>Suffixe</td><td>-D · Discipliné</td><td>-R · Réactif</td><td>Stabilité des décisions sous stress, respect de ses propres règles</td></tr>
        </tbody></table></div></section>
      <section style="margin-top:48px"><h2>Le calcul</h2>
        <ol class="steps prose" style="margin-top:16px">
          <li>Chaque réponse est ramenée entre 0 et 1 vers le second pôle de l'axe.</li>
          <li>Le score déclaré est la moyenne des questions déclaratives ; le score révélé, celle des mises en situation, arbitrages chiffrés et comportements passés.</li>
          <li>Le score de l'axe vaut 40 % du déclaré et 60 % du révélé, moins sensible à l'image de soi.</li>
          <li>Au-dessus de 50, la lettre retenue est celle du second pôle. Entre 45 et 55, l'axe est équilibré et un profil voisin est proposé.</li>
          <li>Un écart de plus de 20 points entre déclaré et révélé est signalé.</li>
          <li>Cinq paires de questions miroirs donnent un indice de cohérence ; sous 60, le résultat est présenté comme fragile.</li>
        </ol></section>
      <section style="margin-top:48px"><h2>Les fondements</h2>
        <p class="prose muted" style="margin-top:12px">Théorie des perspectives et aversion aux pertes (Kahneman et Tversky, 1979) ; typologies d'investisseurs de Bailard, Biehl et Kaiser (1986) et de Pompian ; échelle de tolérance au risque de Grable et Lytton (1999) ; choix de loteries de Holt et Laury (2002) ; test de réflexion cognitive de Frederick (2005). Les liens entre biais et comportements s'appuient sur les travaux de Shefrin et Statman (1985), Barber et Odean (2000), Huberman (2001) et Kumar (2009).</p></section>
      <section style="margin-top:48px"><h2>Les allocations d'actifs</h2>
        <p class="prose muted" style="margin-top:12px">Chaque profil reçoit une allocation naturelle sur quinze classes d'actifs, construite par écart à un portefeuille de référence documenté (Graham, Bogle, Browne, Dalio, Swensen, Buffett, Taleb, Faber…), et une inclinaison factorielle de sa poche actions. Les rendements attendus à dix ans proviennent des hypothèses de marché publiées par Amundi (mise à jour du second semestre 2026) et J.P. Morgan (2026), complétées d'estimations signalées comme telles. Les performances en crise sont des ordres de grandeur en euros, calculés classe par classe pour 2008, le krach de février-mars 2020 et 2022.</p>
        <div class="table-wrap" style="margin-top:16px"><table class="mtable"><thead><tr><th>Classe d'actifs</th><th>Rendement attendu</th><th>Source</th><th>2008</th><th>Krach 2020</th><th>2022</th></tr></thead><tbody>
          ${CL.map(c => `<tr><td>${c.nom}</td><td class="mono">${c.r === null ? "–" : c.r.toFixed(1).replace(".", ",") + " %"}</td><td>${c.rs}</td>${c.c.map(x => `<td class="mono">${fmt(x)} %</td>`).join("")}</tr>`).join("")}
        </tbody></table></div></section>
      <section style="margin-top:48px"><h2>Sources</h2>
        <ul class="list prose" style="margin-top:12px">${window.SOURCES.map(x => `<li><a href="${x.u}" target="_blank" rel="noopener">${x.t}</a></li>`).join("")}</ul>
        <h3 style="margin-top:24px">Recherche citée</h3>
        <ul class="list prose muted" style="margin-top:12px">${window.RECHERCHE.map(x => `<li>${x}</li>`).join("")}</ul></section>
      <section style="margin-top:48px"><h2>Les limites</h2>
        <p class="prose muted" style="margin-top:12px">Ce test décrit un tempérament ; il ne remplace ni un questionnaire d'adéquation réglementaire, ni un conseil en investissement. Les allocations sont illustratives. Les codes à quatre lettres simplifient des scores continus : regardez toujours l'intensité de chaque axe. La version 1.0 n'a pas encore fait l'objet d'une validation statistique sur un large échantillon.</p></section>
      <div class="actions" style="margin-top:32px"><a class="btn" href="#test-complet">Passer le test</a></div>`);
  }

  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
