<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Investype">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Investype : 16 profils pour découvrir quel investisseur vous êtes vraiment, vos biais et l'allocation type qui illustre votre tempérament.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Profils d'investisseurs — feuille de style
   Mise en page : une colonne éditoriale de 1080 px max ; le test en plein écran centré ;
   le résultat comme une fiche de fonds (en-tête de profil, jauges, allocation). */
:root {
  --paper: #f3f5f6;
  --surface: #ffffff;
  --sunken: #e8ecef;
  --ink: #132029;
  --muted: #566573;
  --line: #d6dde2;
  --cta: #132029;
  --cta-ink: #ffffff;
  --pat: #2b7a66;   /* Patrimoniaux */
  --tac: #2f63a6;   /* Tacticiens */
  --con: #6a55a8;   /* Conquérants */
  --opp: #c27c12;   /* Opportunistes */
  --good: #2b7a66;
  --warn: #b26a00;
  --ref: #9aa7b1;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e151b; --surface: #16212a; --sunken: #1c2933; --ink: #e5ebef; --muted: #96a5b1;
    --line: #2a3843; --cta: #e5ebef; --cta-ink: #0e151b;
    --pat: #4fb39a; --tac: #6a9be0; --con: #9d8be0; --opp: #e7a541; --good: #4fb39a; --warn: #e7a541; --ref: #5d6c78;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e151b; --surface: #16212a; --sunken: #1c2933; --ink: #e5ebef; --muted: #96a5b1;
  --line: #2a3843; --cta: #e5ebef; --cta-ink: #0e151b;
  --pat: #4fb39a; --tac: #6a9be0; --con: #9d8be0; --opp: #e7a541; --good: #4fb39a; --warn: #e7a541; --ref: #5d6c78;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body {
  margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2.2rem, 5.5vw, 3.6rem); font-weight: 700; }
h2 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 650; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--tac); outline-offset: 3px; border-radius: 6px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--font-data); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.wrap { max-width: 1080px; margin: 0 auto; }
.prose { max-width: 66ch; }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--paper) 88%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.brand-mark { display: grid; grid-template-columns: repeat(2, 9px); gap: 3px; }
.brand-mark i { width: 9px; height: 9px; border-radius: 2px; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav a { text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: 0.92rem; color: var(--muted); }
.nav a:hover { color: var(--ink); background: var(--sunken); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--sunken); font-weight: 600; }

main { padding-block: 40px 72px; }
section + section { margin-top: 72px; }

/* Boutons */
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 999px; border: 1px solid var(--cta); background: var(--cta); color: var(--cta-ink); font-weight: 600; text-decoration: none; cursor: pointer; transition: transform .15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn .meta { font-family: var(--font-data); font-size: 0.75rem; opacity: 0.75; font-weight: 400; }

/* Accueil */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 48px; align-items: center; }
.hero-text { display: grid; gap: 22px; min-width: 0; }
.hero-text .lead { font-size: 1.15rem; color: var(--muted); max-width: 52ch; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.matrix { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.matrix a { display: grid; place-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 12px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); transition: transform .2s ease, border-color .2s ease; }
.matrix a:hover { transform: translateY(-3px); border-color: var(--ink); }
.matrix .code { font-family: var(--font-data); font-size: 0.72rem; letter-spacing: 0.08em; color: var(--muted); }
.matrix svg { width: 100%; max-width: 72px; height: auto; }
.matrix-legend { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; color: var(--muted); font-family: var(--font-data); }

.axes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 24px; }
.axis-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 10px; align-content: start; }
.axis-poles { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; }
.axis-poles .l { font-family: var(--font-data); font-size: 1.3rem; }
.axis-poles .rule { flex: 1; height: 2px; background: linear-gradient(90deg, var(--line), var(--ink), var(--line)); border-radius: 2px; }
.axis-card p { font-size: 0.93rem; color: var(--muted); }

.families { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 24px; }
.family { border-radius: var(--r); padding: 20px; display: grid; gap: 8px; align-content: start; background: color-mix(in srgb, var(--fam) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--fam) 35%, var(--line)); }
.family .tag { font-family: var(--font-data); font-size: 0.8rem; color: var(--fam); font-weight: 600; letter-spacing: 0.06em; }
.family p { font-size: 0.93rem; color: var(--muted); }

.formats { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0; margin-top: 24px; border-top: 1px solid var(--line); }
.formats > div { padding: 18px 20px 18px 0; border-bottom: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.formats p { font-size: 0.93rem; color: var(--muted); }
.sec-head { display: grid; gap: 10px; max-width: 66ch; }

/* Test */
.test { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
.progress { display: grid; gap: 8px; }
.progress-bar { height: 6px; background: var(--sunken); border-radius: 6px; overflow: hidden; }
.progress-bar > i { display: block; height: 100%; background: var(--ink); border-radius: 6px; transition: width .3s ease; }
.progress-meta { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-data); font-size: 0.8rem; color: var(--muted); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(22px, 4vw, 40px); display: grid; gap: 24px; }
.qtag { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--sunken); font-size: 0.78rem; font-family: var(--font-data); color: var(--muted); }
.chip.date { background: color-mix(in srgb, var(--opp) 16%, var(--surface)); color: var(--ink); }
.qtext { font-family: var(--font-display); font-size: clamp(1.25rem, 2.6vw, 1.6rem); font-weight: 600; line-height: 1.3; text-wrap: pretty; }
.likert { display: grid; gap: 14px; }
.likert-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.likert-end { font-size: 0.85rem; font-weight: 600; width: 92px; flex-shrink: 0; }
.likert-end.r { text-align: right; }
.likert-dots { display: flex; align-items: center; justify-content: center; gap: clamp(8px, 2.5vw, 22px); flex: 1; }
.dot { border-radius: 50%; border: 2px solid var(--muted); background: transparent; cursor: pointer; padding: 0; transition: transform .15s ease, background .15s ease; }
.dot:hover { transform: scale(1.08); }
.dot[data-v="1"], .dot[data-v="5"] { width: 50px; height: 50px; }
.dot[data-v="2"], .dot[data-v="4"] { width: 40px; height: 40px; }
.dot[data-v="3"] { width: 30px; height: 30px; }
.dot[data-v="1"], .dot[data-v="2"] { border-color: var(--tac); }
.dot[data-v="4"], .dot[data-v="5"] { border-color: var(--opp); }
.dot[aria-pressed="true"][data-v="1"], .dot[aria-pressed="true"][data-v="2"] { background: var(--tac); }
.dot[aria-pressed="true"][data-v="3"] { background: var(--muted); }
.dot[aria-pressed="true"][data-v="4"], .dot[aria-pressed="true"][data-v="5"] { background: var(--opp); }
.likert-labels { display: none; justify-content: space-between; font-size: 0.8rem; font-weight: 600; }
.options { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; transition: border-color .15s ease, background .15s ease; }
.opt:hover { border-color: var(--ink); }
.opt .k { font-family: var(--font-data); font-size: 0.8rem; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--sunken); flex-shrink: 0; }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--sunken); }
.opt[aria-pressed="true"] .k { background: var(--ink); color: var(--paper); }
.opt.neutral { border-style: dashed; color: var(--muted); }
.test-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.linkbtn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 8px 0; font-size: 0.92rem; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--ink); }
.linkbtn:disabled { opacity: 0.35; cursor: default; }
.kbd-hint { font-size: 0.8rem; color: var(--muted); }

/* Résultat et fiche */
.pcard { --fam: var(--ink); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; padding: clamp(22px, 4vw, 36px); border-radius: 22px; background: color-mix(in srgb, var(--fam) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--fam) 35%, var(--line)); }
.pcard svg.emblem { width: clamp(110px, 18vw, 160px); height: auto; }
.pcard .code-big { font-family: var(--font-data); font-size: clamp(1.5rem, 4vw, 2.1rem); letter-spacing: 0.08em; color: var(--fam); font-weight: 600; }
.pcard .devise { font-family: var(--font-display); font-size: 1.1rem; font-style: italic; color: var(--muted); margin-top: 8px; }
.pcard .fam-label { font-size: 0.9rem; margin-top: 10px; }
.pcard-text { display: grid; gap: 4px; min-width: 0; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.panel h3 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

.gauge { display: grid; gap: 6px; }
.gauge-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.88rem; }
.gauge-head .win { font-weight: 700; }
.gauge-track { position: relative; height: 12px; border-radius: 6px; background: var(--sunken); }
.gauge-fill { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.gauge-mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); opacity: .5; }
.gauge-tick { position: absolute; top: -5px; width: 2px; height: 22px; background: var(--ink); border-radius: 1px; }
.gauge-tick.decl { background: transparent; border-left: 2px dashed var(--ink); width: 0; }
.gauge-foot { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 0.72rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 0; border-top: 2px solid var(--ink); vertical-align: middle; margin-right: 6px; }
.legend i.d { border-top-style: dashed; }

.signals { display: grid; gap: 10px; }
.signal { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 14px; border-radius: 12px; background: var(--sunken); font-size: 0.93rem; }
.signal .pill { font-family: var(--font-data); font-size: 0.72rem; padding: 3px 8px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
.pill.good { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.pill.info { background: color-mix(in srgb, var(--tac) 18%, transparent); color: var(--tac); }

.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.list li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: 0.95rem; }
.list li::before { content: ""; width: 8px; height: 8px; border-radius: 2px; margin-top: 8px; background: var(--fam, var(--ink)); }
.list.minus li::before { background: transparent; border: 2px solid var(--warn); width: 8px; height: 8px; border-radius: 50%; }

.alloc-bar { display: flex; height: 34px; border-radius: 10px; overflow: hidden; gap: 2px; }
.alloc-bar > span { display: grid; place-items: center; font-family: var(--font-data); font-size: 0.72rem; color: #fff; min-width: 0; overflow: hidden; }
.alloc-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.alloc-table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 0.78rem; padding: 0 0 8px; }
.alloc-table td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: middle; }
.alloc-table td.n { width: 44px; text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.alloc-table td.bars { width: 46%; padding-left: 12px; }
.alloc-table .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
.pair { display: grid; gap: 3px; }
.pair i { display: block; height: 7px; border-radius: 4px; }
.pair i.ref { background: var(--ref); height: 4px; }
.delta { font-family: var(--font-data); font-size: 0.75rem; }
.delta.up { color: var(--good); } .delta.down { color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 0.88rem; }
.callout { border-left: 3px solid var(--fam, var(--ink)); padding: 4px 0 4px 16px; display: grid; gap: 4px; }
.callout .eyebrow { color: var(--fam, var(--muted)); }
.disclaimer { font-size: 0.82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; max-width: 80ch; }
.share { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.share input { flex: 1; min-width: 0; font-family: var(--font-data); font-size: 0.78rem; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.toast { font-size: 0.85rem; color: var(--good); }

/* Galerie */
.gallery-fam { display: grid; gap: 16px; }
.gallery-fam + .gallery-fam { margin-top: 48px; }
.gallery-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.gallery-head .tag { font-family: var(--font-data); color: var(--fam); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.pcard-mini { --fam: var(--ink); display: grid; gap: 10px; padding: 20px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-decoration: none; transition: transform .2s ease, border-color .2s ease; align-content: start; }
.pcard-mini:hover { transform: translateY(-3px); border-color: var(--fam); }
.pcard-mini svg { width: 72px; height: auto; }
.pcard-mini .code { font-family: var(--font-data); color: var(--fam); font-weight: 600; letter-spacing: 0.08em; font-size: 0.85rem; }
.pcard-mini p { font-size: 0.88rem; color: var(--muted); }

/* Méthode */
.steps { counter-reset: s; display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; font-size: 0.95rem; }
.steps li::before { content: counter(s); font-family: var(--font-data); font-size: 0.8rem; width: 26px; height: 26px; border-radius: 8px; background: var(--sunken); display: grid; place-items: center; }
.table-wrap { overflow-x: auto; }
.mtable { width: 100%; border-collapse: collapse; font-size: 0.92rem; min-width: 560px; }
.mtable th, .mtable td { text-align: left; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.mtable th { font-size: 0.78rem; color: var(--muted); font-weight: 500; }

footer { border-top: 1px solid var(--line); padding-block: 28px 40px; font-size: 0.85rem; color: var(--muted); }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

@media (max-width: 820px) {
  .hero, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .pcard { grid-template-columns: minmax(0, 1fr); justify-items: start; }
}
@media (max-width: 560px) {
  .likert-end { display: none; }
  .likert-labels { display: flex; }
  .dot[data-v="1"], .dot[data-v="5"] { width: 44px; height: 44px; }
  .dot[data-v="2"], .dot[data-v="4"] { width: 36px; height: 36px; }
  .nav a { padding: 6px 9px; font-size: 0.85rem; }
  .brand span { font-size: 0.95rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Version 1.1 : fiche longue, allocation enrichie */
.story { display: grid; gap: 56px; }
.story-lead { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.prose-lg { display: grid; gap: 18px; font-size: 1.12rem; line-height: 1.7; max-width: 64ch; }
.prose-lg p:first-child::first-letter { font-family: var(--font-display); font-size: 3.2em; float: left; line-height: 0.9; padding: 6px 10px 0 0; color: var(--fam); font-weight: 700; }
.quick { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.chapter { display: grid; gap: 14px; }
.chapter > .eyebrow { color: var(--fam); }
.prose { line-height: 1.7; }
.moment { border-top: 3px solid var(--good); }
.moment.warn { border-top-color: var(--warn); }
.moment .eyebrow { color: var(--good); }
.moment.warn .eyebrow { color: var(--warn); }
.model { display: grid; gap: 4px; padding: 16px 18px; border-radius: var(--r); background: color-mix(in srgb, var(--fam) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--fam) 30%, var(--line)); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.kpis > div { display: grid; gap: 4px; padding: 16px 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); align-content: start; }
.kpi { font-family: var(--font-display); font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpis .muted { font-size: 0.82rem; line-height: 1.4; }
.stack { display: grid; gap: 20px; align-content: start; min-width: 0; }
.small { font-size: 0.82rem; }
.alloc-table tr.grp td { font-family: var(--font-data); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding-top: 14px; border-top: none; }
.crisis { display: grid; gap: 6px; padding-block: 8px; border-top: 1px solid var(--line); }
.crisis:first-of-type { border-top: none; }
.crisis-head { font-size: 0.9rem; }
.crisis-bars { display: grid; gap: 4px; }
.cb { display: grid; grid-template-columns: 52px minmax(0, 1fr) 56px; gap: 10px; align-items: center; font-size: 0.82rem; }
.cb .mono { text-align: right; }
.cb-track { height: 8px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
.cb-track i { display: block; height: 100%; border-radius: 4px; }
.factor { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.9rem; padding-block: 4px; }
.fdots { display: flex; gap: 6px; }
.fdots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); }
.fdots i.zero { border-style: dashed; }
.fdots i.on { background: var(--fam); border-color: var(--fam); }
.flegend { display: flex; justify-content: flex-end; gap: 52px; font-family: var(--font-data); font-size: 0.7rem; color: var(--muted); }
.rels { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 8px; }
.rel { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-decoration: none; font-size: 0.9rem; transition: border-color .2s ease; }
.rel:hover { border-color: var(--fam); }
.rel svg { width: 56px; height: auto; }
.rel .eyebrow { display: block; color: var(--fam); }
@media (max-width: 820px) {
  .story-lead { grid-template-columns: minmax(0, 1fr); }
  .quick { position: static; }
  .kpis { grid-template-columns: minmax(0, 1fr); }
}

/* Version 1.2 : avertissement réglementaire, liquidité */
.reg { font-size: 0.88rem; line-height: 1.5; padding: 12px 16px; border-radius: 12px; background: var(--sunken); border-left: 3px solid var(--warn); }
.reg a, .disclaimer a, footer a { color: inherit; text-underline-offset: 3px; }
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.liq { font-family: var(--font-data); font-size: 0.72rem; padding: 1px 7px; border-radius: 999px; font-weight: 600; }
.liq.good { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.liq.info { background: color-mix(in srgb, var(--tac) 18%, transparent); color: var(--tac); }
.liq.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.legal { display: grid; gap: 12px; margin-top: 32px; }
.legal h2 { font-size: 1.15rem; margin-top: 16px; }
@media (max-width: 980px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .kpis { grid-template-columns: minmax(0, 1fr); } }

/* Version 1.3 : facteurs de style */
.frow { display: grid; gap: 4px; padding-block: 6px; }
.fhead { display: flex; justify-content: space-between; gap: 12px; font-size: 0.9rem; }
.fword { font-family: var(--font-data); font-size: 0.75rem; color: var(--fam); font-weight: 600; text-align: right; }
.fword.muted { color: var(--muted); font-weight: 400; }
.ftrack { position: relative; height: 10px; border-radius: 5px; background: var(--sunken); }
.fmid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); opacity: .6; }
.ffill { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: var(--fam); }
.fends { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 0.68rem; color: var(--muted); }
.fneutral { font-size: 0.92rem; padding: 12px 14px; border-radius: 10px; background: var(--sunken); }
.fdetails summary { cursor: pointer; font-size: 0.88rem; font-weight: 600; }
.fdetails[open] summary { margin-bottom: 10px; }
.fdetails .list li { font-size: 0.86rem; }
.kpi-word { font-size: 1.5rem; }
.pscale { display: flex; gap: 4px; }
.pscale i { flex: 1; height: 6px; border-radius: 3px; background: var(--sunken); }
.pscale i.on { background: var(--fam); }

/* Version 1.4 : ajustements téléphone */
@media (hover: none) { .kbd-hint { display: none; } }
@media (max-width: 560px) {
  .top .wrap { gap: 10px; }
  .nav { flex-wrap: nowrap; gap: 2px; }
  .nav a { padding: 6px 8px; font-size: 0.82rem; white-space: nowrap; }
}

/* Version 2.0 : étape 2, profil de risque indicatif */
.btn:disabled { opacity: 0.4; cursor: default; transform: none; }
.e2-title { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.15; }
.e2 .qcard > p { line-height: 1.6; }
.e2-pillars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.e2-pillars > div { display: grid; gap: 2px; align-content: start; padding: 12px; border-radius: 12px; background: var(--sunken); font-size: 0.92rem; }
.e2-intro { font-size: 0.92rem; color: var(--muted); border-left: 3px solid var(--opp); padding-left: 12px; }
.e2-aide { font-size: 0.88rem; line-height: 1.55; padding: 12px 14px; border-radius: 12px; background: var(--sunken); color: var(--muted); }
.opt.multi .k { border: 1px solid var(--line); }
.e2-cta { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; border-left: 4px solid var(--fam, var(--ink)); }
.e2-cta h2 { margin: 6px 0 8px; }
.e2-res .sec-head { max-width: none; }
.e2-res .reg { margin-top: 16px; }
.ladder { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 20px; }
.lvl { display: grid; gap: 6px; align-content: start; padding: 16px 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.lvl.bind { border-color: var(--warn); }
.lvl .pill { justify-self: start; font-family: var(--font-data); font-size: 0.7rem; padding: 3px 8px; border-radius: 999px; font-weight: 600; }
.lvl.final { background: color-mix(in srgb, var(--fam) 10%, var(--surface)); border: 2px solid var(--fam); }
.lvl.final .eyebrow { color: var(--fam); }
.list.cplx li, .list.quiz li { font-size: 0.88rem; }
.list.cplx li.ok::before, .list.quiz li.ok::before { background: var(--good); }
.list.cplx li.ko::before, .list.quiz li.ko::before { background: transparent; border: 2px solid var(--warn); border-radius: 50%; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.86rem; color: var(--muted); cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--ink); }
.e2-res .alloc-table td.n { width: 72px; }
@media (max-width: 980px) { .ladder { grid-template-columns: repeat(2, minmax(0, 1fr)); } .e2-pillars { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .ladder, .e2-pillars { grid-template-columns: minmax(0, 1fr); } .e2-cta { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .signal { grid-template-columns: minmax(0, 1fr); gap: 6px; } .signal .pill { justify-self: start; } }

/* Version 2.0 : fiabilité en résumé, détail en fin de page */
.fiab-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.fiab-line .eyebrow { margin-right: 4px; }
.fiab-line .pill { font-family: var(--font-data); font-size: 0.72rem; padding: 3px 8px; border-radius: 999px; font-weight: 600; }
.fiab-line .linkbtn { padding: 0; font-size: 0.85rem; }
.fiab { display: grid; gap: 10px; max-width: 80ch; }
.signals.compact { gap: 0; }
.signals.compact .signal { background: none; border-radius: 0; padding: 10px 0; border-top: 1px solid var(--line); font-size: 0.88rem; }
.stack.fill { grid-template-rows: auto 1fr; }
.e2-mini { border-left: 4px solid var(--fam, var(--ink)); gap: 10px; }
.e2-mini h3 { justify-content: flex-start; font-size: 1.35rem; }
.e2-mini .pscale { max-width: 220px; }
.mini-lv { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.86rem; color: var(--muted); }
.mini-lv strong { color: var(--ink); }
.mini-lv .lim strong { color: var(--warn); }

/* Version 2.1 : portraits illustrés */
.portrait { position: relative; display: block; width: 100%; aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--fam); background: #1c2024; box-shadow: 0 6px 18px -10px rgba(10, 16, 20, .55); }
.portrait img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; border-radius: 12px; }
.portrait::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; transform: translateX(-50%) rotate(45deg); background: var(--fam); border: 2px solid var(--surface); border-radius: 2px; }
.matrix a { padding: 8px 8px 10px; gap: 10px; }
.matrix .portrait { max-width: 104px; border-radius: 10px; }
.matrix .portrait img { border-radius: 8px; }
.pcard .portrait { width: clamp(150px, 22vw, 230px); aspect-ratio: 6 / 5; border-width: 3px; border-radius: 18px; }
.pcard .portrait img { border-radius: 15px; }
.pcard-mini .portrait { aspect-ratio: 6 / 5; margin-bottom: 4px; }
.rel .portrait { width: 56px; border-radius: 10px; }
.rel .portrait img { border-radius: 8px; }
.rel .portrait::after { display: none; }
@media (max-width: 820px) { .pcard .portrait { width: min(100%, 300px); } }

</style>
</head>

<script>
/* Banque de questions — version 1.5
   Option avec n: true = réponse neutralisée (exclue du calcul), comme les réponses « non concerné ».
   Les points vont vers le second pôle : Offensive, Court terme, Intuition, Tendance, Réactif.
   type : decl (échelle 1 à 5), sit (mise en situation), chif (chiffré), passe (comportement passé)
   © QuidHabes — Alexandre Hezez, 2026 */

window.AXES = [
  { id: "R", nom: "Risque",    p1: { l: "S", n: "Sécurité" },   p2: { l: "O", n: "Offensive" } },
  { id: "H", nom: "Horizon",   p1: { l: "L", n: "Long terme" }, p2: { l: "C", n: "Court terme" } },
  { id: "M", nom: "Méthode",   p1: { l: "A", n: "Analyse" },    p2: { l: "I", n: "Intuition" } },
  { id: "C", nom: "Consensus", p1: { l: "D", n: "Divergent" },  p2: { l: "T", n: "Tendance" } },
  { id: "X", nom: "Discipline",p1: { l: "D", n: "Discipliné" }, p2: { l: "R", n: "Réactif" } }
];

/* Paires miroirs pour l'indice de cohérence */
window.PAIRES = [["R1","R5"],["H2","H11"],["M2","M11"],["C2","C5"],["X2","X5"]];

/* Version courte (16 questions, sans suffixe) */
window.COURTE = ["R5","R7","R10","R12","H2","H6","H9","H11","M2","M6","M9","M11","C5","C6","C9","C11"];

const o = (...l) => l.map((t, p) => ({ t, p }));

window.QUESTIONS = [
  // Axe Risque
  { id: "R1", axe: "R", type: "decl", texte: "Une baisse de 20 % de mon portefeuille ne m'empêcherait pas de dormir." },
  { id: "R2", axe: "R", type: "decl", inv: true, texte: "Je préfère un rendement modeste mais régulier à un rendement élevé mais incertain." },
  { id: "R3", axe: "R", type: "decl", texte: "Le risque est d'abord pour moi une source d'opportunités." },
  { id: "R4", axe: "R", type: "decl", inv: true, texte: "Je pense davantage à ce que je pourrais perdre qu'à ce que je pourrais gagner." },
  { id: "R5", axe: "R", type: "sit", contexte: "Mars 2020", texte: "Vos actions perdent un tiers de leur valeur en un mois. Que faites-vous ?",
    options: o("Je vends tout pour préserver le reste", "Je réduis de moitié", "Je ne touche à rien", "Je renforce") },
  { id: "R6", axe: "R", type: "sit", contexte: "2022", texte: "Avec la hausse des taux, vos obligations, réputées sûres, perdent 15 % sur l'année. Que faites-vous ?",
    options: o("Je vends tout pour des livrets ou un fonds en euros", "Je réduis", "Je conserve jusqu'à l'échéance", "Je renforce, les rendements sont enfin attractifs") },
  { id: "R7", axe: "R", type: "sit", texte: "Sur dix ans, l'allocation A a pour pire année −8 % et rend 4 % par an. L'allocation B a pour pire année −35 % et rend 8 % par an. Votre choix ?",
    options: o("100 % A", "70 % A, 30 % B", "30 % A, 70 % B", "100 % B") },
  { id: "R8", axe: "R", type: "sit", texte: "Après une forte hausse, une ligne pèse 40 % de vos placements financiers. Que faites-vous ?",
    options: o("Je vends l'essentiel", "Je la ramène à 20 %", "Je la garde", "Je la renforce") },
  { id: "R9", axe: "R", type: "chif", texte: "Pile ou face : 50 % de chances de gagner 10 000 €, 50 % de ne rien gagner. Quel montant certain vous ferait renoncer au pari ?",
    options: o("2 000 € ou moins", "3 000 €", "4 000 €", "5 000 € ou plus") },
  { id: "R10", axe: "R", type: "chif", texte: "Pile ou face : si vous perdez, vous perdez 1 000 €. Quel gain exigez-vous pour accepter de jouer ?",
    options: o("Je ne joue pas, quel que soit le gain", "3 000 € ou plus", "2 000 €", "1 500 € ou moins") },
  { id: "R11", axe: "R", type: "passe", neutre: "Je n'ai jamais connu de baisse significative", texte: "Lors de la plus forte baisse que vous ayez connue sur vos placements, qu'avez-vous fait ?",
    options: o("J'ai vendu l'essentiel", "J'ai vendu une partie", "Rien", "J'ai acheté") },
  { id: "R12", axe: "R", type: "passe", texte: "Avez-vous déjà investi dans un actif que vous saviez très risqué (start-up, crypto-actif, petite capitalisation, levier) ?",
    options: o("Jamais", "Une fois, une petite somme", "Plusieurs fois", "Régulièrement et de façon significative") },

  // Axe Horizon
  { id: "H1", axe: "H", type: "decl", texte: "Je consulte la valeur de mes placements au moins une fois par semaine." },
  { id: "H2", axe: "H", type: "decl", inv: true, texte: "Je peux conserver un placement dix ans sans y toucher." },
  { id: "H3", axe: "H", type: "decl", texte: "Une opportunité doit être saisie vite, sinon elle disparaît." },
  { id: "H4", axe: "H", type: "decl", inv: true, texte: "Les fluctuations d'une année ne disent rien de la qualité d'un placement." },
  { id: "H5", axe: "H", type: "sit", texte: "Une action achetée il y a six mois stagne, alors que le marché a pris 10 %. Que faites-vous ?",
    options: o("Je garde, la thèse reste valable", "J'attends un an avant de juger", "Je réduis", "Je vends pour une valeur qui monte") },
  { id: "H6", axe: "H", type: "sit", texte: "Vous recevez 100 000 € à placer. Comment procédez-vous ?",
    options: o("Un plan sur 15 ans, puis je n'y pense plus", "J'investis progressivement sur 12 mois", "Je garde une large poche pour saisir les occasions", "Je cherche des opportunités à rendement rapide") },
  { id: "H7", axe: "H", type: "sit", texte: "Un placement gagne 25 % en deux mois. Que faites-vous ?",
    options: o("Rien, mon objectif est inchangé", "Je rééquilibre au prochain point annuel", "Je prends une partie des gains", "Je vends tout") },
  { id: "H8", axe: "H", type: "sit", texte: "Une annonce de banque centrale fait bouger les marchés de 2 % dans la journée. Que faites-vous ?",
    options: o("Je ne regarde pas", "Je lis une analyse le soir", "J'ajuste éventuellement le lendemain", "J'agis dans l'heure") },
  { id: "H9", axe: "H", type: "chif", texte: "On vous offre 10 000 € aujourd'hui, ou une somme plus élevée dans cinq ans. À partir de quelle somme acceptez-vous d'attendre ?",
    options: o("11 000 €", "12 500 €", "15 000 €", "20 000 € ou plus") },
  { id: "H10", axe: "H", type: "chif", texte: "Placement A : 3 % par an, versés chaque année. Placement B : 5 % par an, tout versé au bout de dix ans, sans sortie possible. Votre répartition ?",
    options: o("100 % B", "Majorité B", "Majorité A", "100 % A") },
  { id: "H11", axe: "H", type: "passe", texte: "Combien d'achats ou de ventes avez-vous réalisés sur les douze derniers mois ?",
    options: o("Aucun, ou versements programmés", "1 à 5", "6 à 20", "Plus de 20") },
  { id: "H12", axe: "H", type: "passe", neutre: "Je n'ai pas encore de placements", texte: "Depuis quand détenez-vous votre plus ancien placement financier encore en portefeuille ?",
    options: o("Plus de 10 ans", "5 à 10 ans", "1 à 5 ans", "Moins d'un an") },

  // Axe Méthode
  { id: "M1", axe: "M", type: "decl", texte: "Je fais confiance à mon instinct, même quand les chiffres disent le contraire." },
  { id: "M2", axe: "M", type: "decl", inv: true, texte: "Avant d'investir, je lis les comptes ou une analyse détaillée." },
  { id: "M3", axe: "M", type: "decl", texte: "Une bonne histoire d'entreprise me convainc davantage qu'un tableau de ratios." },
  { id: "M4", axe: "M", type: "decl", inv: true, texte: "Je formalise par écrit les raisons de mes investissements." },
  { id: "M5", axe: "M", type: "sit", texte: "Un ami entrepreneur vous présente son projet avec enthousiasme. Que faites-vous ?",
    options: o("Je demande le plan d'affaires et des projections chiffrées", "Je demande quelques chiffres clés", "Je juge surtout l'homme et le marché", "J'investis si je le sens") },
  { id: "M6", axe: "M", type: "sit", texte: "Fonds A : méthode quantitative expliquée en détail. Fonds B : gérant charismatique au palmarès remarquable. Votre choix ?",
    options: o("A sans hésiter", "Plutôt A", "Plutôt B", "B sans hésiter") },
  { id: "M7", axe: "M", type: "sit", texte: "Votre analyse indique d'acheter, mais quelque chose vous gêne sans que vous sachiez quoi. Que faites-vous ?",
    options: o("Je suis l'analyse", "J'achète une demi-position", "J'attends d'y voir clair", "Je renonce, mon intuition prime") },
  { id: "M8", axe: "M", type: "sit", texte: "Quelle est votre source principale pour suivre les marchés ?",
    options: o("Données, rapports annuels, études", "Notes d'analystes et presse spécialisée", "Échanges avec des personnes de confiance", "Mon ressenti et mon expérience") },
  { id: "M9", axe: "M", type: "chif", texte: "Un fonds perd 50 %, puis gagne 50 %. Par rapport au départ, où en est-il ?",
    options: [{ t: "−25 %", p: 0 }, { t: "Je ne sais pas", p: 0, n: true }, { t: "+25 %", p: 2 }, { t: "Revenu au point de départ", p: 3 }] },
  { id: "M10", axe: "M", type: "chif", texte: "Un placement double tous les six ans et atteint 100 000 € au bout de 30 ans. En quelle année valait-il 50 000 € ?",
    options: [{ t: "Année 24", p: 0 }, { t: "Je ne sais pas", p: 0, n: true }, { t: "Année 27", p: 2 }, { t: "Année 15", p: 3 }] },
  { id: "M11", axe: "M", type: "passe", neutre: "Je n'ai pas encore fait d'investissement significatif", texte: "Comment a été décidé votre dernier investissement significatif ?",
    options: o("Après plusieurs semaines d'analyse", "Après quelques jours de réflexion", "Après une discussion convaincante", "Presque immédiatement, par conviction") },
  { id: "M12", axe: "M", type: "passe", texte: "Tenez-vous un suivi écrit de vos décisions et de leurs résultats ?",
    options: o("Systématiquement", "Parfois", "Rarement", "Jamais") },

  // Axe Consensus
  { id: "C1", axe: "C", type: "decl", texte: "Quand tout le monde achète un actif, c'est plutôt un signal pour y aller." },
  { id: "C2", axe: "C", type: "decl", inv: true, texte: "J'aime acheter ce que les autres délaissent." },
  { id: "C3", axe: "C", type: "decl", texte: "Je suis plus à l'aise quand mes choix ressemblent à ceux des investisseurs que je respecte." },
  { id: "C4", axe: "C", type: "decl", inv: true, texte: "Les prévisions consensuelles se trompent souvent aux moments clés." },
  { id: "C5", axe: "C", type: "sit", contexte: "Automne 2008", texte: "Les valeurs bancaires ont perdu 60 % et la presse annonce l'effondrement du système. Que faites-vous ?",

    /* ---------- Objectifs ---------- */

    { id: "O3", bloc: "objectifs", texte: "Prévoyez-vous de retirer régulièrement de l'argent sur cette somme ?",
      options: [{ t: "Non", cap: 5 }, { t: "Oui, moins de 4 % par an", cap: 4 }, { t: "Oui, 4 % par an ou plus", cap: 3 }] },

    /* ---------- Durabilité (arbre : D2 à D4 seulement si D1 = oui) ---------- */
    { id: "D1", bloc: "durabilite", texte: "Souhaitez-vous que vos placements tiennent compte de critères de durabilité ?",
      aide: "Depuis le 2 août 2022, tout conseiller doit vous poser cette question. Vous pouvez répondre non : cela ne change rien au reste de votre profil.",
      options: [{ t: "Oui", v: 1 }, { t: "Non, pas de préférence particulière", v: 0 }] },
    { id: "D2", bloc: "durabilite", si: a => a.D1 === 0, texte: "Quelle part minimale de vos placements doit être investie dans des activités alignées sur la taxonomie européenne ?",
      aide: "La taxonomie européenne définit les activités économiques considérées comme écologiquement durables : elles contribuent substantiellement à un objectif environnemental (climat, eau, économie circulaire, pollution, biodiversité), sans nuire significativement aux autres, et dans le respect de garanties sociales minimales.",
      options: [{ t: "Pas de minimum", v: 0 }, { t: "Au moins 5 %", v: 5 }, { t: "Au moins 10 %", v: 10 }, { t: "Au moins 20 %", v: 20 }] },
    { id: "D3", bloc: "durabilite", si: a => a.D1 === 0, texte: "Quelle part minimale de vos placements doit constituer des « investissements durables » au sens du règlement SFDR ?",
      aide: "Le règlement européen SFDR qualifie d'investissement durable un placement dans une activité qui contribue à un objectif environnemental ou social, sans causer de préjudice important à d'autres objectifs, dans une entreprise appliquant de bonnes pratiques de gouvernance. Ce règlement est en cours de révision.",
      options: [{ t: "Pas de minimum", v: 0 }, { t: "Au moins 10 %", v: 10 }, { t: "Au moins 25 %", v: 25 }, { t: "Au moins 50 %", v: 50 }] },
    { id: "D4", bloc: "durabilite", si: a => a.D1 === 0, multi: true, texte: "Quelles principales incidences négatives souhaitez-vous que vos placements prennent en compte ?",

      options: [{ t: "Climat et environnement", f: "env" }, { t: "Questions sociales et droits humains", f: "soc" }, { t: "Gouvernance et lutte contre la corruption", f: "gouv" }, { t: "Pas de préférence", f: "none", seul: true }] }
  ];
  /* Note : l'option « Oui » de D1 est à l'index 0 ; la condition si() teste donc l'index de réponse 0. */

  /* Classes complexes : retirées si les connaissances ou l'expérience ne les couvrent pas.
     ordre = ordre des bits du code de partage */
  const COMPLEXES = [
    { id: "HY",     regle: "Questions sur les taux et sur le haut rendement réussies",

  ];

  /* Substituts liquides et simples, en proportion du poids retiré */
  const SUBSTITUTS = {
    HY: { IG: 1 }, DETTEP: { IG: 1 }, PE: { ACTD: 0.7, SMALL: 0.3 },
    ALT: { GOVC: 0.5, OR: 0.5 }, CRYPTO: { MON: 1 }, IMMONC: { GOVC: 0.5, INFL: 0.5 }
  };

  /* Poche de sécurité utilisée pour ramener une allocation dans son budget de risque */
  const POCHE = { MON: 40, GOVC: 30, IG: 30 };

  const SOURCES = [
    { t: "ESMA — Orientations sur certains aspects des exigences d'adéquation de MiFID II (ESMA35-43-3172, 2022)", u: "https://www.esma.europa.eu/document/guidelines-certain-aspects-mifid-ii-suitability-requirements-1" },

    { t: "AMF — Synthèse des contrôles SPOT sur la prise en compte des préférences de durabilité (février 2026)", u: "https://www.amf-france.org/sites/institutionnel/files/private/2026-02/synthese-spot-preferences-durabilite-fr.pdf" },
    { t: "Commission européenne — Demande d'avis technique à l'ESMA sur la stratégie pour l'investissement de détail (juillet 2026)", u: "https://www.esma.europa.eu/sites/default/files/2026-08/Call_for_advice_on_RIS_to_ESMA.pdf" }
  ];

<script>
/* Étape 2 — moteur du profil de risque indicatif. Fonctions pures, utilisables dans le navigateur et sous Node.
   Règle : niveau retenu = le plus prudent de (tolérance, capacité de perte, horizon et objectifs).
   Les connaissances filtrent les classes complexes ; le style du profil est conservé à l'intérieur du budget de risque.
   © QuidHabes — Alexandre Hezez, 2026 */
(function (root) {
  const R = () => root.RISQUE;
  const qById = id => R().QUESTIONS.find(q => q.id === id);

  /* Questions affichées compte tenu de l'arbre (durabilité) */
  function visibles(answers) {
    return R().QUESTIONS.filter(q => !q.si || q.si(answers));
  }
  function complet(answers) {
    return visibles(answers).every(q => {
      const a = answers[q.id];
      return q.multi ? Array.isArray(a) && a.length > 0 : typeof a === "number";
    });
  }

  function toleranceDepuisR(scoreR) {
    return 1 + R().BORNES_TOLERANCE.filter(b => scoreR > b).length;
  }

  /* Évaluation des réponses (indices d'options ; tableaux d'indices pour les questions à choix multiples) */
  function evaluer(answers) {
    const opt = id => { const q = qById(id), a = answers[id]; return typeof a === "number" ? q.options[a] : null; };
    const multi = id => { const q = qById(id), a = answers[id]; return Array.isArray(a) ? a.map(i => q.options[i]) : []; };

    const ok = {};
    ["K1", "K2", "K3", "K4", "K5", "K6"].forEach(id => { const o = opt(id); ok[id] = !!(o && o.ok); });
    const K = Object.values(ok).filter(Boolean).length;
    const D = (opt("K0") || { d: 1 }).d;

    const exp = {};
    multi("E1").forEach(o => { exp[o.f] = true; });
    const trans = (opt("E2") || { v: 0 }).v;
    const pro = ((opt("E3") || { v: 0 }).v) === 2;

    const caps = (ids) => ids.map(id => ({ id, cap: (opt(id) || { cap: 5 }).cap }));
    const capS = caps(["S1", "S2", "S3", "S4", "S5", "S6", "S7", "S8"]);
    const capO = caps(["O1", "O2", "O3"]);
    const C = Math.min(...capS.map(x => x.cap));
    const H = Math.min(...capO.map(x => x.cap));
    const bindS = capS.filter(x => x.cap === C && C < 5).map(x => x.id);
    const bindO = capO.filter(x => x.cap === H && H < 5).map(x => x.id);

    const L = (opt("S6") || { liq: 0 }).liq;
    const X = (opt("S7") || { conc: 0 }).conc;
    /* Contradiction entre deux mesures de la capacité de perte (conséquences d'une perte de 30 % / perte supportable en euros) */
    const W = (opt("S5") && opt("S8") && Math.abs(opt("S5").cap - opt("S8").cap) >= 3) ? 1 : 0;

    const e = { ok, K, exp, pro };
    const masque = R().COMPLEXES.map(c => (c.ok(e) ? "1" : "0")).join("");

    const d1 = opt("D1");
    const S = d1 && d1.v === 1 ? 1 : 0;
    const dur = S ? {
      taxo: (opt("D2") || { v: 0 }).v, sfdr: (opt("D3") || { v: 0 }).v,
      pai: multi("D4").filter(o => o.f !== "none").map(o => o.t)
    } : null;

    return { C, H, bindS, bindO, L, X, W, K, D, masque, S, ok, exp, trans, pro, dur };
  }

  /* Code de partage : uniquement des niveaux et des indicateurs, jamais de montants.
     ~k1-C<cap>b<questions>-H<horizon>b<questions>-<masque>-L<liq>-K<quiz>D<déclaré>-X<conc>-W<contradiction>-S<durabilité> */
  function encoder(ev) {
    const b = l => l.map(id => id.slice(1)).join("") || "0";
    return `~k1-C${ev.C}b${b(ev.bindS)}-H${ev.H}b${b(ev.bindO)}-${ev.masque}-L${ev.L}-K${ev.K}D${ev.D}-X${ev.X}-W${ev.W}-S${ev.S}`;
  }
  const RE = /~k1-C([1-5])b(\d{1,8})-H([1-5])b(\d{1,3})-([01]{5})-L([0-2])-K([0-6])D([1-4])-X([0-2])-W([01])-S([01])/;
  function decoder(str) {
    const m = String(str || "").match(RE);
    if (!m) return null;
    const ids = (s, p) => s === "0" ? [] : [...s].map(c => p + c);
    return { C: +m[1], bindS: ids(m[2], "S"), H: +m[3], bindO: ids(m[4], "O"), masque: m[5], L: +m[6], K: +m[7], D: +m[8], X: +m[9], W: +m[10], S: +m[11], token: m[0] };
  }

  /* ---------- Allocation ajustée ---------- */
  const crises = (alloc, CL) => [0, 1, 2].map(i => CL.reduce((t, c) => t + (alloc[c.id] || 0) * c.c[i], 0) / 100);
  const pire = (alloc, CL) => Math.min(...crises(alloc, CL));

  function filtrer(alloc, masque, L) {
    const out = { ...alloc }, retirees = [];
    const retirer = (id, part, cause) => {
      const w = (out[id] || 0) * part;
      if (w <= 0) return;
      out[id] -= w;
      retirees.push({ id, w, cause, vers: R().SUBSTITUTS[id] });
      for (const [k, f] of Object.entries(R().SUBSTITUTS[id])) out[k] = (out[k] || 0) + w * f;
    };
    R().COMPLEXES.forEach((c, i) => { if (masque[i] === "0") retirer(c.id, 1, "connaissances"); });
    /* Besoin de liquidité : illiquides exclus (probable) ou réduits de moitié (possible) */
    if (L > 0) ["IMMONC", "PE", "DETTEP"].forEach(id => retirer(id, L === 2 ? 1 : 0.5, "liquidite"));
    return { alloc: out, retirees };
  }

  /* Part λ de l'allocation conservée : la plus grande part qui respecte le seuil dans chacune des trois crises */
  function lambda(alloc, seuil, CL) {
    if (seuil === null) return 1;
    const P = crises(alloc, CL), B = crises(R().POCHE, CL);
    let l = 1;
    for (let i = 0; i < 3; i++) {
      if (P[i] >= seuil) continue;
      l = Math.min(l, B[i] <= seuil ? 0 : (B[i] - seuil) / (B[i] - P[i]));
    }
    return Math.max(0, Math.min(1, l));
  }

  /* Arrondi à l'entier en conservant un total de 100 (plus forts restes) */
  function arrondir(alloc) {
    const ids = Object.keys(alloc).filter(k => alloc[k] > 1e-9);
    const base = {}, rest = [];
    ids.forEach(k => { base[k] = Math.floor(alloc[k]); rest.push([k, alloc[k] - base[k]]); });
    let manque = 100 - Object.values(base).reduce((a, b) => a + b, 0);
    rest.sort((a, b) => b[1] - a[1]);
    for (let i = 0; manque > 0 && i < rest.length; i++, manque--) base[rest[i][0]]++;
    return base;
  }

  function ajuster(allocNat, niveau, masque, L, CL) {
    const N = R().NIVEAUX[niveau - 1];
    const f = filtrer(allocNat, masque, L);
    const l = lambda(f.alloc, N.seuil, CL);
    const mix = {};
    CL.forEach(c => { mix[c.id] = l * (f.alloc[c.id] || 0) + (1 - l) * (R().POCHE[c.id] || 0); });
    const out = arrondir(mix);
    /* Après arrondi, garantir le seuil : on transfère point par point la classe la plus pénalisante vers le monétaire */
    let garde = 0;
    while (N.seuil !== null && pire(out, CL) < N.seuil && garde++ < 100) {
      const cr = crises(out, CL), i = cr.indexOf(Math.min(...cr));
      const pire_cl = CL.filter(c => c.id !== "MON" && (out[c.id] || 0) > 0).sort((a, b) => a.c[i] - b.c[i])[0];
      out[pire_cl.id]--; out.MON = (out.MON || 0) + 1;
    }
    CL.forEach(c => { if (!(c.id in out)) out[c.id] = 0; });
    return { alloc: out, lambda: l, retirees: f.retirees, filtree: f.alloc };
  }

  /* ---------- Synthèse : trois plafonds et niveau retenu ---------- */
  function profil(scoreR, ev) {
    const T = toleranceDepuisR(scoreR);
    const final = Math.min(T, ev.C, ev.H);
    const limitants = [];
    if (T === final) limitants.push("T");
    if (ev.C === final) limitants.push("C");
    if (ev.H === final) limitants.push("H");
    return { T, C: ev.C, H: ev.H, final, limitants };
  }

  const api = { visibles, complet, evaluer, encoder, decoder, toleranceDepuisR, profil, ajuster, crises, pire, arrondir, lambda, filtrer };
  root.MoteurRisque = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Calcul des scores — fonctions pures, utilisables dans le navigateur et sous Node.
   © QuidHabes — Alexandre Hezez, 2026 */
(function (root) {
  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;

  /* Réponse ramenée entre 0 et 1, vers le second pôle. null = sans réponse ou neutralisée. */
  function norm(q, a) {
    if (a === undefined || a === null || a === "n") return null;
    if (q.type === "decl") return (q.inv ? 5 - a : a - 1) / 4;
    const opt = q.options[a];
    if (!opt || opt.n) return null;
    return opt.p / 3;
  }

  function calc(Q, answers, axes, paires) {
    const byId = Object.fromEntries(Q.map(q => [q.id, q]));
    const out = { axes: {} };
    for (const ax of axes) {
      const d = [], v = [], sit = [];
      for (const q of Q.filter(q => q.axe === ax.id)) {
        const n = norm(q, answers[q.id]);
        if (n === null) continue;
        (q.type === "decl" ? d : v).push(n);
        if (q.type === "sit") sit.push(n);
      }
      if (!d.length && !v.length) { out.axes[ax.id] = null; continue; }
      const D = d.length ? mean(d) * 100 : null;
      const V = v.length ? mean(v) * 100 : null;
      const S = D === null ? V : V === null ? D : 0.4 * D + 0.6 * V;
      /* Départage d'un axe exactement à l'équilibre : score exact, puis révélé, puis mises en situation, puis déclaré, puis parité.
         Sans lui, tout score arrondi à 50 basculait vers le premier pôle et biaisait la répartition des profils. */
      const EPS = 1e-9, sitM = sit.length ? mean(sit) * 100 : null;
      let pole2 = null;
      for (const x of [S, V, sitM, D]) { if (x !== null && Math.abs(x - 50) > EPS) { pole2 = x > 50; break; } }
      /* Égalité parfaite sur tous les critères : départage neutre et reproductible par la parité d'une somme pondérée des réponses brutes. */
      if (pole2 === null) pole2 = Q.filter(q => q.axe === ax.id).reduce((t, q, i) => t + (i + 1) * (typeof answers[q.id] === "number" ? answers[q.id] : 0), 0) % 2 === 1;
      let score = Math.round(S);
      if (pole2 && score <= 50) score = 51;
      if (!pole2 && score > 50) score = 50;
      out.axes[ax.id] = { score, decl: D === null ? null : Math.round(D), rev: V === null ? null : Math.round(V) };
    }
    const diffs = [];
    for (const [a, b] of paires) {
      if (!byId[a] || !byId[b]) continue;
      const na = norm(byId[a], answers[a]), nb = norm(byId[b], answers[b]);
      if (na !== null && nb !== null) diffs.push(Math.abs(na - nb));
    }
    out.coherence = diffs.length >= 3 ? Math.round(100 - 100 * mean(diffs)) : null;
    return out;
  }

  const LETTRES = { R: ["S", "O"], H: ["L", "C"], M: ["A", "I"], C: ["D", "T"] };
  const lettre = (ax, s) => LETTRES[ax][s > 50 ? 1 : 0];

  function code(axesScores) {
    return ["R", "H", "M", "C"].map(a => lettre(a, axesScores[a].score)).join("");
  }
  function suffixe(axesScores) {
    const x = axesScores.X;
    return x ? (x.score > 50 ? "R" : "D") : null;
  }
  /* Profils voisins : chaque axe équilibré (45 à 55) donne le code obtenu en inversant sa lettre. */
  function voisins(axesScores) {
    const base = code(axesScores).split("");
    const res = [];
    ["R", "H", "M", "C"].forEach((a, i) => {
      const s = axesScores[a].score;
      if (s >= 45 && s <= 55) {
        const c = base.slice();
        c[i] = LETTRES[a][s > 50 ? 0 : 1];
        res.push({ axe: a, code: c.join("") });
      }
    });
    return res;
  }

  /* Encodage du résultat dans l'ancre de l'URL : r-<f|c>-<5 scores>-<5 déclarés>-<5 révélés>-<cohérence> */
  const ORDRE = ["R", "H", "M", "C", "X"];
  function encode(mode, res) {
    const f = v => (v === null || v === undefined ? "x" : String(v));
    const s = ORDRE.map(a => f(res.axes[a] && res.axes[a].score));
    const d = ORDRE.map(a => f(res.axes[a] && res.axes[a].decl));
    const r = ORDRE.map(a => f(res.axes[a] && res.axes[a].rev));
    return ["r", mode, ...s, ...d, ...r, f(res.coherence)].join("-");
  }
  const RE = /r-[fc](?:-(?:\d{1,3}|x)){16}/;
  function decode(token) {
    const m = String(token || "").match(RE);
    if (!m) return null;
    const p = m[0].split("-");
    const n = v => (v === "x" ? null : Math.max(0, Math.min(100, parseInt(v, 10))));
    const res = { mode: p[1], axes: {}, token: m[0] };
    ORDRE.forEach((a, i) => {
      const s = n(p[2 + i]);
      res.axes[a] = s === null ? null : { score: s, decl: n(p[7 + i]), rev: n(p[12 + i]) };
    });
    res.coherence = n(p[17]);
    if (["R", "H", "M", "C"].some(a => !res.axes[a])) return null;
    return res;
  }

  root.Scoring = { norm, calc, code, suffixe, voisins, encode, decode };
  if (typeof module !== "undefined") module.exports = root.Scoring;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>

<script>
/* Profils d'investisseurs — application (routeur, test, résultat, galerie, méthode)

(function () {
  "use strict";
  const Q = window.QUESTIONS, AXES = window.AXES, P = window.PROFILS, F = window.FAMILLES;
  const CL = window.CLASSES, REF = window.REFERENCE, S = window.Scoring;
  const RQ = window.RISQUE, MR = window.MoteurRisque;
  const app = document.getElementById("app");
  const AX4 = AXES.filter(a => a.id !== "X");
  const FAM_VAR = { SL: "--pat", SC: "--tac", OL: "--con", OC: "--opp" };
  const famOf = code => code.slice(0, 2);
  const famColor = code => `var(${FAM_VAR[famOf(code)]})`;
  const FORMAT_LABEL = { decl: "Déclaratif", sit: "Mise en situation", chif: "Arbitrage chiffré", passe: "Comportement passé" };

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* idem */ } }
  };

  /* ---------- Emblème : forme = horizon, glyphe = méthode, chevrons = consensus, étincelle = offensive ---------- */
  function emblem(code, cls) {
    const PT = window.PORTRAITS;
    if (PT && PT[code]) return `<span class="portrait ${cls || ""}" style="--fam:${famColor(code)}"><img src="${PT[code]}" alt="Portrait du profil ${code}, ${P[code].nom}" decoding="async"></span>`;
    const off = code[0] === "O", court = code[1] === "C", intu = code[2] === "I", tend = code[3] === "T";
    const outer = court
      ? `<path d="M60 8 L112 60 L60 112 L8 60 Z" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>`
      : `<circle cx="60" cy="60" r="51" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3.5"/>`;
    const glyph = intu
      ? `<path d="M34 50 C42 40 50 40 58 50 S74 60 86 50" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
         <path d="M34 62 C42 52 50 52 58 62 S74 72 86 62" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity=".55"/>`
      : `<rect x="38" y="56" width="9" height="12" rx="2" fill="currentColor"/><rect x="51" y="47" width="9" height="21" rx="2" fill="currentColor"/><rect x="64" y="38" width="9" height="30" rx="2" fill="currentColor"/><rect x="77" y="52" width="6" height="16" rx="2" fill="currentColor" opacity=".45"/>`;
    const chev = (x, rev) => rev
      ? `<path d="M${x + 6} 78 L${x} 84 L${x + 6} 90" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`
      : `<path d="M${x} 78 L${x + 6} 84 L${x} 90" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`;
    const chevrons = chev(44, false) + chev(56, false) + (tend ? chev(68, false) : chev(68, true));
    const spark = off ? `<path d="M92 14 L95 23 L104 26 L95 29 L92 38 L89 29 L80 26 L89 23 Z" fill="currentColor"/>` : "";
    return `<svg class="emblem ${cls || ""}" viewBox="0 0 120 120" style="color:${famColor(code)}" role="img" aria-label="Emblème du profil ${code}">${outer}${glyph}${chevrons}${spark}</svg>`;
  }

  /* ---------- Routeur ---------- */
  function route() {
    const h = decodeURIComponent((location.hash || "").slice(1));
    document.querySelectorAll(".nav a").forEach(a => a.removeAttribute("aria-current"));
    const mark = id => { const a = document.querySelector(`.nav a[data-nav="${id}"]`); if (a) a.setAttribute("aria-current", "page"); };
    if (h === "test-complet") { mark("test"); return renderTest("f"); }
    if (h === "test-court") { mark("test"); return renderTest("c"); }
    if (h.startsWith("etape2/")) { const r = S.decode(h.slice(7)); if (r) { mark("test"); return renderEtape2(r); } }
    if (h.startsWith("r-")) { const r = S.decode(h); if (r) return renderResult(r); }
    if (h === "profils") { mark("profils"); return renderGallery(); }
    if (h.startsWith("profil-") && P[h.slice(7)]) { mark("profils"); return renderProfile(h.slice(7)); }
    if (h === "methode") { mark("methode"); return renderMethod(); }
    if (h === "avertissement") return renderLegal();
    renderHome();
  }
  function show(html) { app.innerHTML = html; window.scrollTo(0, 0); }

  /* ---------- Accueil ---------- */
  function renderHome() {
    const order = ["SL", "SC", "OL", "OC"];
    const codes = order.flatMap(f => Object.keys(P).filter(c => famOf(c) === f));
    const last = store.get("pi-dernier");
    show(`
      <section class="hero">
        <div class="hero-text">
          <span class="eyebrow">Investype · 16 profils pour découvrir quel investisseur vous êtes vraiment</span>
          <h1>Quel investisseur êtes-vous vraiment ?</h1>
          <p class="lead">Quatre axes, des mises en situation tirées de vraies crises de marché, et une confrontation entre ce que vous dites et ce que vous feriez. À la clé : votre profil, vos biais, et l'allocation type qui illustre votre tempérament.</p>
          <p class="muted small">En option, une étape 2 de six minutes transforme votre tempérament en profil de risque indicatif et ajuste l'allocation à votre situation.</p>
          <p class="muted small">Outil pédagogique, gratuit et sans collecte de données. Il ne constitue pas un conseil en investissement. <a href="#avertissement">Avertissement</a></p>
          <div class="actions">
            <a class="btn" href="#test-complet">Passer le test complet <span class="meta">56 questions · 12 min</span></a>
            <a class="btn ghost" href="#test-court">Version courte <span class="meta">16 questions · 4 min</span></a>
          </div>
          ${last ? `<p class="muted">Votre dernier résultat : <a href="#${last.token}"><strong class="mono">${last.code}</strong> · ${P[last.code.slice(0, 4)].nom}</a></p>` : ""}
        </div>
        <div>
          <div class="matrix" aria-label="Les 16 profils">
            ${codes.map(c => `<a href="#profil-${c}" title="${P[c].nom}">${emblem(c)}<span class="code">${c}</span></a>`).join("")}
          </div>
          <div class="matrix-legend">${order.map(f => `<span style="color:var(${FAM_VAR[f]})">● ${F[f].nom.replace("Les ", "")}</span>`).join("")}</div>
        </div>
      </section>

      <section>
        <div class="sec-head">
          <span class="eyebrow">La grille</span>
          <h2>Quatre axes, deux lettres chacun</h2>
          <p class="muted">Votre code combine une lettre par axe. Chaque axe est mesuré de 0 à 100 : vous voyez de quel côté vous penchez, et avec quelle intensité.</p>
        </div>
        <div class="axes">
          ${axisCard("R", "Votre rapport à la perte et à la volatilité : préserver le capital, ou accepter les secousses pour aller chercher le rendement.")}
          ${axisCard("H", "Votre patience : laisser le temps travailler, ou ajuster souvent pour saisir les mouvements.")}
          ${axisCard("M", "Votre manière de décider : par les chiffres et les modèles, ou par le flair et le récit.")}
          ${axisCard("C", "Votre position face à la foule : acheter ce que les autres délaissent, ou suivre la tendance.")}
        </div>
        <p class="muted" style="margin-top:16px">Un suffixe complète le code : <strong>-D Discipliné</strong> ou <strong>-R Réactif</strong>, selon que vous tenez vos règles sous le stress.</p>
